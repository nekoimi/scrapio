syntax = "proto3";

package grpc;
option go_package = "github.com/nekoimi/scrapio/internal/drission_rod/grpc";

message FetchRequest {
  string url = 1;
  int32 timeout = 2;
}

message FetchResponse {
  bool success = 1;
  string html = 2;
  string error = 3;
}

message BrowserAction {
  string type = 1;
  string selector = 2;
  string value = 3;
  string script = 4;
  int32 timeout_ms = 5;
}

message BrowserJobRequest {
  string protocol_version = 1;
  string request_id = 2;
  string url = 3;
  string profile = 4;
  string recipe = 5;
  int32 timeout_ms = 6;
  repeated BrowserAction actions = 7;
  repeated string outputs = 8;
  map<string, string> headers = 9;
  bool close_page = 10;
}

message BrowserCookie {
  string name = 1;
  string value = 2;
  string domain = 3;
  string path = 4;
}

message BrowserActionResult {
  int32 index = 1;
  string type = 2;
  bool success = 3;
  int64 duration_ms = 4;
  string error = 5;
}

message BrowserJobResponse {
  bool success = 1;
  string protocol_version = 2;
  string request_id = 3;
  string error_code = 4;
  string error = 5;
  string html = 6;
  string text = 7;
  string json = 8;
  bytes screenshot = 9;
  repeated BrowserCookie cookies = 10;
  int64 duration_ms = 11;
  string final_url = 12;
  int32 status_code = 13; // 0 when the browser cannot report navigation status.
  string content_type = 14;
  repeated BrowserActionResult action_results = 15;
}

message BrowserHealthRequest {
  string protocol_version = 1;
  string request_id = 2;
}

message BrowserHealthResponse {
  bool ready = 1;
  string protocol_version = 2;
  string request_id = 3;
  string message = 4;
}

message EditorSessionCreateRequest {
  string protocol_version = 1;
  string request_id = 2;
  string session_id = 3;
  string url = 4;
  int32 ttl_seconds = 5;
  int32 viewport_width = 6;
  int32 viewport_height = 7;
}

message EditorSessionRequest {
  string protocol_version = 1;
  string request_id = 2;
  string session_id = 3;
  int32 ttl_seconds = 4;
  string page_state_id = 5;
}

message EditorSessionResponse {
  bool success = 1;
  string protocol_version = 2;
  string request_id = 3;
  string session_id = 4;
  string status = 5;
  string error_code = 6;
  string error = 7;
  int64 expires_at_unix_ms = 8;
  string page_state_id = 9;
  string current_url = 10;
  int32 viewport_width = 11;
  int32 viewport_height = 12;
  bytes screenshot = 13;
}

message EditorCommandRequest {
  string protocol_version = 1;
  string request_id = 2;
  string session_id = 3;
  string command_id = 4;
  string page_state_id = 5;
  string type = 6;
  string locator_strategy = 7;
  string locator_expression = 8;
  string value = 9;
  int32 timeout_ms = 10;
  bool confirmed = 11;
  bool has_position = 12;
  double x = 13;
  double y = 14;
}

message EditorCommandResponse {
  bool success = 1;
  string protocol_version = 2;
  string command_id = 3;
  string status = 4;
  string error_code = 5;
  string error = 6;
  string before_page_state_id = 7;
  string after_page_state_id = 8;
  string final_url = 9;
  int64 duration_ms = 10;
  string locator_strategy = 11;
  string locator_expression = 12;
}

// Read-only page inspection; bounded JSON payloads share one versioned contract.
message EditorInspectionRequest {
  string protocol_version = 1;
  string request_id = 2;
  string session_id = 3;
  string page_state_id = 4;
  string operation = 5; // inspect, dom, locator-check
  string input_json = 6;
}

message EditorInspectionResponse {
  bool success = 1;
  string protocol_version = 2;
  string request_id = 3;
  string error_code = 4;
  string error = 5;
  string result_json = 6;
}

service PageFetchService {
  rpc Fetch(FetchRequest) returns (FetchResponse);
  rpc FetchJavDB(FetchRequest) returns (FetchResponse);
  rpc FetchSehuatang(FetchRequest) returns (FetchResponse);
  rpc Execute(BrowserJobRequest) returns (BrowserJobResponse);
  rpc Health(BrowserHealthRequest) returns (BrowserHealthResponse);
  rpc CreateEditorSession(EditorSessionCreateRequest) returns (EditorSessionResponse);
  rpc GetEditorSession(EditorSessionRequest) returns (EditorSessionResponse);
  rpc HeartbeatEditorSession(EditorSessionRequest) returns (EditorSessionResponse);
  rpc CloseEditorSession(EditorSessionRequest) returns (EditorSessionResponse);
  rpc FrameEditorSession(EditorSessionRequest) returns (EditorSessionResponse);
  rpc ExecuteEditorCommand(EditorCommandRequest) returns (EditorCommandResponse);
  rpc GetEditorCommand(EditorCommandRequest) returns (EditorCommandResponse);
  rpc InspectEditorPage(EditorInspectionRequest) returns (EditorInspectionResponse);
}
