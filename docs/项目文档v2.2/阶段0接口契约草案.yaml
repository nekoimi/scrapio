openapi: 3.0.3
info:
  title: scrapio v2.2 editor contract spike
  version: 0.22.0-d05
  description: A02～D05 开发契约：固定版本采集、定时/API、冻结查询和导出、完整运行中心、日常首页与方案健康、失败输入修复草稿、全样例离线回归、版本比较与历史草稿复制、异常策略与正式恢复确认、加密凭据和隔离浏览器授权、Schema影响与容量保留/操作审计。真实迁移、并发和页面验收另行记录。
servers:
  - url: /api/v3
security:
  - bearerAuth: []
paths:
  /tables/{table_id}/schema-history:
    parameters:
      - in: path
        name: table_id
        required: true
        schema:
          type: string
    get:
      summary: 不可变 Schema 历史，最多100个版本
      x-implementation-status: implemented
      responses:
        '200':
          description: 新产品域结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaHistoryEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /tables/{table_id}/schema-checks:
    parameters:
      - in: path
        name: table_id
        required: true
        schema:
          type: string
    post:
      summary: Schema 修改影响预览，不修改记录
      x-implementation-status: implemented
      responses:
        '201':
          description: 新产品域结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaImpactEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaChangeInput'
      description: 预览10分钟有效；最多201个依赖、100条历史记录抽样，完整记录数/Schema版本分布。唯一键变更、活动运行、启用调度、超过200个依赖或100个Schema版本阻断；不做历史值转换。
  /tables/{table_id}/schema-checks/{check_id}/confirm:
    parameters:
      - in: path
        name: table_id
        required: true
        schema:
          type: string
      - in: path
        name: check_id
        required: true
        schema:
          type: string
    post:
      summary: 确认预览，事务发布新 Schema；原check_id重复调用返回已应用版本
      x-implementation-status: implemented
      responses:
        '200':
          description: 新产品域结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaImpactEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovernanceConfirmation'
      description: 重查owner、期限、Schema版本和依赖摘要；表行锁序列化正式写入/输出确认。旧记录和Schema不改写，旧版本需要重新绑定输出/试采/发布；变更与committed审计同事务。
  /settings/retention:
    get:
      summary: 当前账号容量、固定上限和保留规则
      x-implementation-status: implemented
      responses:
        '200':
          description: 新产品域结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionStateEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    put:
      summary: revision乐观锁更新规则；不立即清理
      x-implementation-status: implemented
      responses:
        '200':
          description: 新产品域结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicyEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionPolicy'
      description: 编辑资产池仅包括capture正文、sample截图及活动输入预留。默认512MiB/7天，可配16..4096MiB/1..365天；不能降低到已用与预留总量以下。正式数据、冻结证据、操作审计单独长期保留。
  /settings/cleanup-checks:
    post:
      summary: 创建有界清理预览；不释放资产
      x-implementation-status: implemented
      responses:
        '201':
          description: 新产品域结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanupPreviewEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      description: 每批最多200项、最多20份未应用预览、10分钟有效。保留全部样例/试采输入、输出检查、正式观察与修复引用；过期无引用查询快照/导出文件可清理。既有导出worker保留自动过期回收，可能使预览失效。
  /settings/cleanup-checks/{check_id}/confirm:
    parameters:
      - in: path
        name: check_id
        required: true
        schema:
          type: string
    post:
      summary: 显式确认同一批清理；重复确认返回原结果
      x-implementation-status: implemented
      responses:
        '200':
          description: 新产品域结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanupPreviewEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovernanceConfirmation'
      description: 事务内重查owner/revision/期限、逐项锁定并重查引用/状态/哈希；任何变化整批回滚返回409。仅清空capture正文并标记failed/INPUT_EXPIRED，保留请求键/哈希防止旧请求重发；不删除样例/正式数据/冻结证据。
  /operations:
    get:
      summary: 按账号隔离的变更操作记录游标页
      x-implementation-status: implemented
      responses:
        '200':
          description: 新产品域结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationPageEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
      description: >-
        只含标识、模板动作、状态、操作者和安全数字摘要，不含正文/URL/秘密。认证/v3变更请求执行前记录started，失败拒绝执行；成功响应succeeded不等于所有业务事务原子审计。治理变更另有同事务committed记录。500结果outcome_unknown，进程中断遗留started须查询原资源；API-key触发和调度由既有运行/事件来源记录。非UUID请求ID仅保存哈希。
  /me:
    get:
      summary: 当前登录身份；沿用现有认证
      responses:
        '200':
          description: 身份
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      username:
                        type: string
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
  /home:
    get:
      summary: 当前用户的新产品日常首页
      description: 仅 owner 的 v22 数据，不混入旧记录/试采。不调用浏览器；仓储读取限5秒，错误不返回伪空状态。
      x-implementation-status: implemented
      parameters: []
      responses:
        '200':
          description: HomeOverview
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/HomeOverview'
                  request_id:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '408':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /collectors/health:
    get:
      summary: 未归档方案的运行健康分页
      description: ID倒序分页，锚点必须仍属于当前用户/未归档/匹配attention，否则404后重新读取。最近失败、有限覆盖和调度阻断为需核对；不以零新增报警。
      x-implementation-status: implemented
      parameters:
        - name: attention
          in: query
          schema:
            type: boolean
            default: false
        - name: cursor
          in: query
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
      responses:
        '200':
          description: HealthPage
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/HealthPage'
                  request_id:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '408':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /collectors/{collector_id}/health:
    get:
      summary: 方案健康、最近有效采集和调度证据
      description: 按owner授权；归档方案可直接读取，但不进入首页活动/待办列表。
      x-implementation-status: implemented
      parameters: []
      responses:
        '200':
          description: CollectorHealth
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/CollectorHealth'
                  request_id:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '408':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    parameters:
      - $ref: '#/components/parameters/CollectorId'
  /runs/{run_id}/repair-context:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: 读取正式失败运行修复上下文
      description: 仅failed/partial与当前owner；不修改草稿或访问网站，字段诊断只返回键；原文校验后明确状态。
      x-implementation-status: implemented
      responses:
        '200':
          description: RepairContext
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/RepairContext'
                  request_id:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '408':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
        - name: document_id
          in: query
          schema:
            type: string
            format: uuid
          description: 由页面树显式选择，必须属于该运行。
  /collectors/{collector_id}/repair-drafts:
    parameters:
      - $ref: '#/components/parameters/CollectorId'
    post:
      summary: 关联失败输入到现有草稿或另建原版本草稿
      description: >-
        continue不修改现有定义；fork复制原运行冻结定义/入口并移除原output确认，revision=1，不复制调度/发布/样例。上下文+离线副本+新草稿同事务；expected_revision冲突不覆盖。同owner最多100个，同key同输入复用、异输入409。认证后存储5秒，超时/异常先查by-key。
      x-implementation-status: implemented
      responses:
        '201':
          description: RepairContext
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/RepairContext'
                  request_id:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '408':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepairDraftInput'
  /repair-drafts/by-key:
    get:
      summary: 查询原修复请求，不再次创建
      description: 按owner/key恢复已提交结果。未知/未提交404，查询不会创建。
      x-implementation-status: implemented
      responses:
        '200':
          description: RepairContext
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/RepairContext'
                  request_id:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '408':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
  /repair-drafts/{repair_id}:
    parameters:
      - name: repair_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: 读取持久修复来源与输入
      description: owner授权。离线副本独立于原文保留；副本缺失/损坏更新状态，不改用其他文档或访问网站。草稿后续修改用当前revision重新预览。
      x-implementation-status: implemented
      responses:
        '200':
          description: RepairContext
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/RepairContext'
                  request_id:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '408':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /capabilities:
    get:
      summary: 可用编辑与运行能力
      responses:
        '200':
          description: 能力快照
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/CapabilitiesResponse'
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
  /collectors:
    post:
      summary: 从 URL 创建新产品草稿
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - entry_url
                - entry_type
              properties:
                entry_url:
                  type: string
                  format: uri
                  maxLength: 2048
                entry_type:
                  type: string
                  enum:
                    - web
                    - json
                name:
                  type: string
                  maxLength: 160
      responses:
        '201':
          description: 草稿已创建
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/Collector'
                  request_id:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
      description: 同一 owner/operation/key 的并发请求序列化；重试返回同一资源 ID，修改创建输入或复制来源返回 409。
    get:
      summary: 当前用户的新采集方案列表
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: cursor
          schema:
            type: string
      responses:
        '200':
          description: 方案列表
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Collector'
                      has_more:
                        type: boolean
                      next_cursor:
                        type: string
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
  /collectors/{collector_id}/copies:
    parameters:
      - $ref: '#/components/parameters/CollectorId'
    post:
      summary: 复制方案为新的独立草稿，不复制运行或数据
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 副本已创建
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/Collector'
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
      description: 同一 owner/operation/key 的并发请求序列化；重试返回同一资源 ID，修改创建输入或复制来源返回 409。
  /collectors/{collector_id}/draft:
    parameters:
      - $ref: '#/components/parameters/CollectorId'
    get:
      summary: 读取新草稿
      responses:
        '200':
          description: 草稿
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/Collector'
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
    put:
      summary: 按 revision 更新草稿
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expected_revision
                - definition
              properties:
                expected_revision:
                  type: integer
                  minimum: 1
                definition:
                  $ref: '#/components/schemas/Definition'
                name:
                  type: string
                  maxLength: 160
      responses:
        '200':
          description: 新 revision
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/Collector'
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
