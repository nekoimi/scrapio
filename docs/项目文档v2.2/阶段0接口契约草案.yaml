          format: uuid
        expected_revision:
          type: integer
          minimum: 0
        name:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          type: string
          enum:
            - http_header
            - browser_cookie
        origin:
          type: string
          description: 准确 origin；browser_cookie 仅HTTPS
        storage:
          type: string
          enum:
            - encrypted
            - environment
        header:
          type: string
          enum:
            - ''
            - Authorization
            - Cookie
            - X-API-Key
            - API-Key
            - X-Auth-Token
        prefix:
          type: string
          maxLength: 128
        env:
          type: string
          description: 环境引用仅允许 SCRAPIO_SECRET_ 前缀
        secret:
          type: string
