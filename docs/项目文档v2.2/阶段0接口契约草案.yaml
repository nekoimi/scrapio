components:
  securitySchemes:
    collectorTrigger:
      type: http
      scheme: bearer
      bearerFormat: sap_256bit
      description: 方案专用触发凭据；与管理 JWT 完全分开，仅授权 api-runs。
    bearerAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 沿用现有登录返回的原始 JWT，不添加 Bearer 前缀；也支持 token cookie。
  parameters:
    SampleId:
      in: path
      name: sample_id
      required: true
      schema:
        type: string
        format: uuid
    CaptureId:
      in: path
      name: capture_id
      required: true
      schema:
        type: string
        format: uuid
    CollectorId:
      in: path
      name: collector_id
      required: true
      schema:
        type: string
    SessionId:
      in: path
      name: session_id
      required: true
      schema:
        type: string
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        maxLength: 128
  responses:
    Error:
      description: 结构化错误；401/403/404/409/410/503 使用相同结构
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    SchemaChangeInput:
      type: object
      properties:
        expected_schema_version:
          type: integer
          minimum: 1
        schema:
          $ref: '#/components/schemas/LogicalTableSchema'
      required:
        - expected_schema_version
        - schema
      additionalProperties: false
    GovernanceConfirmation:
      type: object
      properties:
        confirmed:
          type: boolean
          enum:
            - true
      required:
        - confirmed
      additionalProperties: false
    SchemaFieldChange:
      type: object
      properties:
        field_key:
          type: string
        kind:
          type: string
          enum:
            - added
            - changed
            - removed
        before:
          $ref: '#/components/schemas/LogicalTableField'
        after:
          $ref: '#/components/schemas/LogicalTableField'
      required:
        - field_key
        - kind
      additionalProperties: false
    SchemaImpact:
      type: object
      properties:
        check_id:
          type: string
        table_id:
          type: string
        expected_schema_version:
          type: integer
        applied_version:
          type: integer
        schema:
          $ref: '#/components/schemas/LogicalTableSchema'
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SchemaFieldChange'
        blockers:
          type: array
          items:
            type: string
        record_count:
          type: integer
        record_versions:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
        dependencies:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
        sampled_records:
          type: integer
        historical_violations:
          type: array
          items:
            type: object
            properties:
              record_id:
                type: string
              schema_version:
                type: string
              issues:
                type: array
                items:
                  $ref: '#/components/schemas/OutputIssue'
            required:
              - record_id
              - schema_version
              - issues
            additionalProperties: false
        analysis_truncated:
          type: boolean
        expires_at:
          type: string
          format: date-time
      required:
        - check_id
        - table_id
        - expected_schema_version
        - applied_version
        - schema
        - changes
        - blockers
        - record_count
        - record_versions
        - dependencies
        - sampled_records
        - historical_violations
        - analysis_truncated
        - expires_at
      additionalProperties: false
    RetentionPolicy:
      type: object
      properties:
        revision:
          type: integer
          minimum: 0
        capture_days:
          type: integer
          minimum: 1
          maximum: 365
        asset_limit_mib:
          type: integer
          minimum: 16
          maximum: 4096
      required:
        - revision
        - capture_days
        - asset_limit_mib
      additionalProperties: false
    RetentionState:
      type: object
      properties:
        policy:
          $ref: '#/components/schemas/RetentionPolicy'
        asset_bytes:
          type: integer
        reserved_bytes:
          type: integer
        usage:
          type: object
          additionalProperties:
            type: string
        limits:
          type: object
          additionalProperties:
            type: integer
        fixed_retention:
          type: object
          additionalProperties:
            type: integer
        scope:
          type: string
      required:
        - policy
        - asset_bytes
        - reserved_bytes
        - usage
        - limits
        - fixed_retention
        - scope
      additionalProperties: false
    CleanupPreview:
      type: object
