openapi: 3.0.3
info:
  title: scrapio v2.2 editor contract spike
  version: 0.2.0-a02-a03
  description: >-
    A02/A03 开发契约：独立草稿与 editor.v1 会话已实现并进行本机集成验证；标记 planned 的元素检查、命令、定位器接口留给 A04/A05，尚不可调用。远程部署验收另行记录。旧
    /api/v1、/api/v2 保持独立。JSON 成功响应为 {data,request_id}；错误为 {error,request_id}。
servers:
  - url: /api/v3
security:
  - bearerAuth: []
paths:
  /me:
    get:
      summary: 当前登录身份；沿用现有认证
      responses:
        '200':
          description: 身份
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      username:
                        type: string
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
  /home:
    get:
      summary: 新产品首页状态；数据域未建立时返回 pending
      responses:
        '200':
          description: 首页状态
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - pending
                          - ready
                      reason:
                        type: string
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
  /capabilities:
    get:
      summary: 可用编辑与运行能力
      responses:
        '200':
          description: 能力快照
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/CapabilitiesResponse'
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
  /collectors:
    post:
      summary: 从 URL 创建新产品草稿
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - entry_url
                - entry_type
              properties:
                entry_url:
                  type: string
                  format: uri
                  maxLength: 2048
                entry_type:
                  type: string
                  enum:
                    - web
                    - json
                name:
                  type: string
                  maxLength: 160
      responses:
        '201':
          description: 草稿已创建
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/Collector'
                  request_id:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
      description: 同一 owner/operation/key 的并发请求序列化；重试返回同一资源 ID，修改创建输入或复制来源返回 409。
    get:
      summary: 当前用户的新采集方案列表
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: cursor
          schema:
            type: string
      responses:
        '200':
          description: 方案列表
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Collector'
                      has_more:
                        type: boolean
                      next_cursor:
                        type: string
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
  /collectors/{collector_id}/copies:
    parameters:
      - $ref: '#/components/parameters/CollectorId'
    post:
      summary: 复制方案为新的独立草稿，不复制运行或数据
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 副本已创建
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/Collector'
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
      description: 同一 owner/operation/key 的并发请求序列化；重试返回同一资源 ID，修改创建输入或复制来源返回 409。
  /collectors/{collector_id}/draft:
    parameters:
      - $ref: '#/components/parameters/CollectorId'
    get:
      summary: 读取新草稿
      responses:
        '200':
          description: 草稿
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/Collector'
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
    put:
      summary: 按 revision 更新草稿
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expected_revision
                - definition
              properties:
                expected_revision:
                  type: integer
                  minimum: 1
                definition:
                  $ref: '#/components/schemas/Definition'
                name:
                  type: string
                  maxLength: 160
      responses:
        '200':
          description: 新 revision
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/Collector'
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
  /collectors/{collector_id}/archive:
    parameters:
      - $ref: '#/components/parameters/CollectorId'
    post:
      summary: 归档当前用户的草稿
      responses:
        '200':
          description: 已归档
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
  /collectors/{collector_id}/validate:
    parameters:
      - $ref: '#/components/parameters/CollectorId'
    post:
      summary: 检查当前草稿结构并绑定当前 revision；不访问目标网站
      responses:
        '200':
          description: 结构检查结果
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    type: object
                    properties:
                      collector:
                        $ref: '#/components/schemas/Collector'
                      validation:
                        $ref: '#/components/schemas/ValidationResult'
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
  /browser-sessions:
    post:
      summary: 为指定草稿创建编辑会话
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - collector_id
                - draft_revision
              properties:
                collector_id:
                  type: string
                draft_revision:
                  type: integer
                  minimum: 1
                viewport:
                  $ref: '#/components/schemas/Viewport'
      responses:
        '200':
          description: 幂等重放已有会话状态
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/SessionResponse'
                  request_id:
                    type: string
        '201':
          description: 会话和传输信息
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/SessionResponse'
                  request_id:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      description: >-
        仅 web 入口可创建。默认 viewport 1280×800，TTL 120 秒。同一 owner/key 绑定 collector_id、draft_revision 和规范化
        viewport；不同输入返回 409。网络结果不确定时沿用原 key 重试，终态会话使用新 key。
      x-implementation-status: implemented
  /browser-sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      summary: 会话状态
      responses:
        '200':
          description: 状态
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/SessionResponse'
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
    delete:
      summary: 关闭编辑会话
      responses:
        '204':
          description: 已确认关闭；重复关闭可安全重试
        '401':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      description: 先持久化关闭状态阻止心跳复活。远端释放失败返回可重试的 503，浏览器 TTL 仍会回收遗留页；前端保留会话信息用于重试关闭。
      x-implementation-status: implemented
  /browser-sessions/{session_id}/resume:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      summary: 重新读取仍存在的会话；不创建页面、不重放步骤
      responses:
        '200':
          description: 恢复信息
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/SessionResponse'
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
      description: 服务传输异常返回 disconnected；页面丢失或过期返回 410。重建入口需要新会话，检查点重放属于 A04。
      x-implementation-status: implemented
  /browser-sessions/{session_id}/frame:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - in: query
        name: page_state_id
        required: true
        schema:
          type: string
    get:
      summary: 获取对应页面版本的 PNG 截图，返回 X-Page-State-ID 并禁止缓存
      responses:
        '200':
          description: 画面帧；X-Page-State-ID 与请求一致
          headers:
            X-Page-State-ID:
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      description: 陈旧页面状态返回 409。页面版本覆盖 DOM、导航、滚动、viewport 变化，不保证捕获 canvas、视频和动画的每个像素变化。
      x-implementation-status: implemented
  /browser-sessions/{session_id}/events:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      summary: 认证 SSE 会话状态快照及状态变化
      responses:
        '200':
          description: >-
            event: session，data 为未包裹的 SessionResponse。每条连接从当前快照开始，约每 3 秒检查状态，15 秒
            keepalive；事件编号仅连接内递增。无历史持久化，无 Last-Event-ID 回放，断线重新读取最新状态。
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
  /browser-sessions/{session_id}/inspect:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      summary: 只检查元素，不执行网页点击
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - page_state_id
                - x
                - 'y'
              properties:
                page_state_id:
                  type: string
                x:
                  type: number
                  minimum: 0
                'y':
                  type: number
                  minimum: 0
                mode:
                  type: string
                  enum:
                    - record
                    - field
      responses:
        '200':
          description: 元素候选和样本
          content:
            application/json:
              schema:
                type: object
                required:
                  - element_id
                  - page_state_id
                  - match_count
                  - locators
                properties:
                  element_id:
                    type: string
                    description: 临时页面元素 ID，不持久化
                  page_state_id:
                    type: string
                  match_count:
                    type: integer
                    minimum: 0
                  sample_values:
                    type: array
                    items:
                      type: string
                  locators:
                    type: array
                    items:
                      $ref: '#/components/schemas/Locator'
        '409':
          $ref: '#/components/responses/Error'
      x-implementation-status: planned
  /browser-sessions/{session_id}/locator-checks:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      summary: 验证持久化定位器的命中数量和样本，不执行网页动作
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - page_state_id
                - locator
              properties:
                page_state_id:
                  type: string
                locator:
                  $ref: '#/components/schemas/Locator'
      responses:
        '200':
          description: 命中结果
          content:
            application/json:
              schema:
                type: object
                required:
                  - page_state_id
                  - match_count
                properties:
                  page_state_id:
                    type: string
                  match_count:
                    type: integer
                    minimum: 0
                  sample_values:
                    type: array
                    items:
                      type: string
        '409':
          $ref: '#/components/responses/Error'
      x-implementation-status: planned
  /browser-sessions/{session_id}/commands:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      summary: 执行一次明确的浏览器命令
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
      responses:
        '202':
          description: 命令已接受，页面变更由状态事件确认
          content:
            application/json:
              schema:
                type: object
                required:
                  - command_id
                  - status
                properties:
                  command_id:
                    type: string
                  status:
                    type: string
                    enum:
                      - queued
                      - running
                      - succeeded
                      - failed
        '409':
          $ref: '#/components/responses/Error'
      x-implementation-status: planned
  /browser-sessions/{session_id}/commands/{command_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - in: path
        name: command_id
        required: true
        schema:
          type: string
    get:
      summary: 查询动作回执
      responses:
        '200':
          description: 动作结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
      x-implementation-status: planned
  /browser-sessions/{session_id}/heartbeat:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      summary: 续期可用会话，建议每 20 秒调用；续期 TTL 为 120 秒
      responses:
        '200':
          description: 最新会话状态
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/SessionResponse'
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
components:
  securitySchemes:
    bearerAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 沿用现有登录返回的原始 JWT，不添加 Bearer 前缀；也支持 token cookie。
  parameters:
    CollectorId:
      in: path
      name: collector_id
      required: true
      schema:
        type: string
    SessionId:
      in: path
      name: session_id
      required: true
      schema:
        type: string
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        maxLength: 128
  responses:
    Error:
      description: 结构化错误；401/403/404/409/410/503 使用相同结构
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CapabilitiesResponse:
      type: object
      properties:
        editor_protocol:
          type: string
          example: editor.v1
        browser_ready:
          type: boolean
          description: 只有实际浏览器就绪才能声明 true；当前探测不启动浏览器，返回 false。
        supported_actions:
          type: array
          items:
            type: string
        supports_live_inspection:
          type: boolean
        definition_versions:
          type: array
          items:
            type: integer
        reason:
          type: string
        editor_service_connected:
          type: boolean
          description: editor.v1 无副作用探测成功；不保证远程 Chromium 能启动。
    DraftResponse:
      type: object
      required:
        - id
        - revision
        - definition
      properties:
        id:
          type: string
        revision:
          type: integer
          minimum: 1
        definition:
          $ref: '#/components/schemas/Definition'
    Collector:
      type: object
      required:
        - id
        - name
        - entry_url
        - entry_type
        - status
        - revision
        - definition
      properties:
        id:
          type: string
        name:
          type: string
        entry_url:
          type: string
          format: uri
        entry_type:
          type: string
          enum:
            - web
            - json
        status:
          type: string
          enum:
            - draft
            - published
            - archived
        revision:
          type: integer
          minimum: 1
        validation_status:
          type: string
          enum:
            - not_validated
            - valid
            - invalid
            - stale
        validation_errors:
          type: array
          items:
            type: string
        save_summary:
          $ref: '#/components/schemas/SaveSummary'
        definition:
          type: object
    SaveSummary:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
        changed_fields:
          type: array
          items:
            type: string
            enum:
              - name
              - entry_url
              - definition
        saved_at:
          type: string
          format: date-time
    ValidationResult:
      type: object
      required:
        - valid
        - errors
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
    Definition:
      type: object
      required:
        - definition_version
        - entry_url
        - steps
      properties:
        definition_version:
          type: integer
          example: 1
        entry_url:
          type: string
          format: uri
        steps:
          type: array
          items:
            type: object
            required:
              - step_id
              - type
            properties:
              step_id:
                type: string
              type:
                type: string
                enum:
                  - navigate
                  - action
                  - record
                  - detail
                  - next_page
                  - extract
                  - output
              config:
                type: object
                additionalProperties: true
    Viewport:
      type: object
      required:
        - width
        - height
      properties:
        width:
          type: integer
          minimum: 320
          maximum: 3840
        height:
          type: integer
          minimum: 240
          maximum: 2160
    SessionResponse:
      type: object
      required:
        - session_id
        - collector_id
        - draft_revision
        - status
        - expires_at
        - page_state_id
        - current_url
        - viewport
        - frame_url
        - heartbeat_interval_seconds
        - available
        - needs_reopen
      properties:
        session_id:
          type: string
        status:
          type: string
          enum:
            - creating
            - ready
            - disconnected
            - expired
            - closed
            - failed
        expires_at:
          type: string
          format: date-time
        page_state_id:
          type: string
        current_url:
          type: string
        viewport:
          $ref: '#/components/schemas/Viewport'
        collector_id:
          type: string
        draft_revision:
          type: integer
          minimum: 1
        frame_url:
          type: string
        heartbeat_interval_seconds:
          type: integer
          example: 20
        available:
          type: boolean
        needs_reopen:
          type: boolean
    Locator:
      type: object
      required:
        - strategy
        - expression
      properties:
        strategy:
          type: string
          enum:
            - css
            - xpath
        expression:
          type: string
        relative_to:
          type: string
          description: 可选的重复记录容器 step_id
    CommandRequest:
      type: object
      required:
        - page_state_id
        - type
      properties:
        page_state_id:
          type: string
        type:
          type: string
          enum:
            - navigate
            - back
            - forward
            - refresh
            - click
            - input
            - wait
            - scroll
        locator:
          $ref: '#/components/schemas/Locator'
        value:
          type: string
          description: 不允许保存密码；敏感值只能使用凭据引用
        credential_ref:
          type: string
        timeout_ms:
          type: integer
          minimum: 100
          maximum: 30000
    CommandResult:
      type: object
      required:
        - command_id
        - status
      properties:
        command_id:
          type: string
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
        before_page_state_id:
          type: string
        after_page_state_id:
          type: string
        duration_ms:
          type: integer
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorResponse:
      type: object
      required:
        - error
        - request_id
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
        request_id:
          type: string
    ErrorBody:
      type: object
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        stage:
          type: string
        step_id:
          type: string
        path:
          type: string
        latest:
          $ref: '#/components/schemas/Collector'
