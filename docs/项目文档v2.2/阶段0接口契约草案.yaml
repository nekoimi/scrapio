          type: boolean
      required:
        - check_id
        - policy_revision
        - items
        - bytes
        - has_more
        - expires_at
        - applied
      additionalProperties: false
    SchemaHistory:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
      required:
        - items
      additionalProperties: false
    OperationPage:
