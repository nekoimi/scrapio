          type: integer
          minimum: 1
        type:
          type: string
          enum:
            - navigate
            - back
            - forward
            - refresh
            - click
            - input
            - wait
            - scroll
        locator:
          $ref: '#/components/schemas/Locator'
        position:
          type: object
          required:
            - x
            - 'y'
          properties:
            x:
              type: number
              minimum: 0
              maximum: 3840
            'y':
              type: number
              minimum: 0
              maximum: 2160
          description: 仅 click 支持；当前截图 PNG 像素，浏览器按 devicePixelRatio 转为 CSS 坐标；与 locator 互斥。
        value:
          type: string
          maxLength: 4096
          description: navigate 为 URL；普通 input 文本；scroll 为像素整数；无 locator 的 wait 为等待毫秒。密码/验证码/敏感字段输入拒绝；待 D04 凭据支持。input 文本不保存进命令日志。
        timeout_ms:
          type: integer
          minimum: 100
          maximum: 30000
          default: 10000
        confirmed:
          type: boolean
          default: false
          description: click/input 必须显式确认。
        record:
          type: boolean
          default: false
        step_id:
          type: string
          maxLength: 128
          description: record=true 时必填；成功后用于加入草稿。
    CommandResult:
      type: object
      required:
