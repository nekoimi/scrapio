      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
        next_cursor:
          type: string
        has_more:
          type: boolean
      required:
        - items
        - next_cursor
        - has_more
      additionalProperties: false
    SchemaImpactEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SchemaImpact'
        request_id:
          type: string
      required:
        - data
        - request_id
      additionalProperties: false
    RetentionPolicyEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/RetentionPolicy'
        request_id:
          type: string
      required:
        - data
        - request_id
      additionalProperties: false
    RetentionStateEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/RetentionState'
        request_id:
          type: string
      required:
        - data
        - request_id
      additionalProperties: false
    CleanupPreviewEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CleanupPreview'
        request_id:
          type: string
      required:
        - data
        - request_id
      additionalProperties: false
    SchemaHistoryEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SchemaHistory'
        request_id:
          type: string
      required:
        - data
        - request_id
      additionalProperties: false
    OperationPageEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/OperationPage'
        request_id:
          type: string
      required:
        - data
        - request_id
      additionalProperties: false
    Credential:
      type: object
      required:
        - credential_id
        - credential_ref
        - revision
        - name
        - kind
        - origin
        - storage
        - header
        - prefix
        - env
        - expires_at
        - mask_selectors
        - status
        - revoked_at
        - created_at
        - updated_at
      properties:
        credential_id:
          type: string
          format: uuid
        credential_ref:
          type: string
        revision:
          type: integer
        name:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          type: string
          enum:
            - http_header
            - browser_cookie
        origin:
          type: string
          description: 准确 origin；browser_cookie 仅HTTPS
        storage:
          type: string
          enum:
            - encrypted
            - environment
        header:
          type: string
          enum:
            - ''
            - Authorization
            - Cookie
            - X-API-Key
            - API-Key
            - X-Auth-Token
        prefix:
          type: string
          maxLength: 128
        env:
          type: string
          description: 环境引用仅允许 SCRAPIO_SECRET_ 前缀
        expires_at:
          type: string
          format: date-time
        mask_selectors:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 256
        status:
          type: string
          enum:
            - available
            - expired
            - revoked
            - key_unavailable
            - environment_missing
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
