openapi: 3.0.3
info:
  title: scrapio v2.2 editor contract spike
  version: 0.5.0-a06
  description: A02～A06 开发契约：草稿、会话、动作、只读点选及记录/详情路径。发版实环境验收另行记录；离线 previews、完整 trials 与正式数据写入尚未实现。
servers:
  - url: /api/v3
security:
  - bearerAuth: []
paths:
  /me:
    get:
      summary: 当前登录身份；沿用现有认证
      responses:
        '200':
          description: 身份
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      username:
                        type: string
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
  /home:
    get:
      summary: 新产品首页状态；数据域未建立时返回 pending
      responses:
        '200':
          description: 首页状态
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - pending
                          - ready
                      reason:
                        type: string
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
  /capabilities:
    get:
      summary: 可用编辑与运行能力
      responses:
        '200':
          description: 能力快照
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/CapabilitiesResponse'
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
  /collectors:
    post:
      summary: 从 URL 创建新产品草稿
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - entry_url
                - entry_type
              properties:
                entry_url:
                  type: string
                  format: uri
                  maxLength: 2048
                entry_type:
                  type: string
                  enum:
                    - web
                    - json
                name:
                  type: string
                  maxLength: 160
      responses:
        '201':
          description: 草稿已创建
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/Collector'
                  request_id:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
      description: 同一 owner/operation/key 的并发请求序列化；重试返回同一资源 ID，修改创建输入或复制来源返回 409。
    get:
      summary: 当前用户的新采集方案列表
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: cursor
          schema:
            type: string
      responses:
        '200':
          description: 方案列表
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Collector'
                      has_more:
                        type: boolean
                      next_cursor:
                        type: string
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
  /collectors/{collector_id}/copies:
    parameters:
      - $ref: '#/components/parameters/CollectorId'
    post:
      summary: 复制方案为新的独立草稿，不复制运行或数据
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 副本已创建
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/Collector'
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
      description: 同一 owner/operation/key 的并发请求序列化；重试返回同一资源 ID，修改创建输入或复制来源返回 409。
  /collectors/{collector_id}/draft:
    parameters:
      - $ref: '#/components/parameters/CollectorId'
    get:
      summary: 读取新草稿
      responses:
        '200':
          description: 草稿
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/Collector'
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
    put:
      summary: 按 revision 更新草稿
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expected_revision
                - definition
              properties:
                expected_revision:
                  type: integer
                  minimum: 1
                definition:
                  $ref: '#/components/schemas/Definition'
                name:
                  type: string
                  maxLength: 160
      responses:
        '200':
          description: 新 revision
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/Collector'
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
  /collectors/{collector_id}/archive:
    parameters:
      - $ref: '#/components/parameters/CollectorId'
    post:
      summary: 归档当前用户的草稿
      responses:
        '200':
          description: 已归档
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
  /collectors/{collector_id}/validate:
    parameters:
      - $ref: '#/components/parameters/CollectorId'
    post:
      summary: 检查当前草稿结构并绑定当前 revision；不访问目标网站
      responses:
        '200':
          description: 结构检查结果
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    type: object
                    properties:
                      collector:
                        $ref: '#/components/schemas/Collector'
                      validation:
                        $ref: '#/components/schemas/ValidationResult'
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
  /browser-sessions:
    post:
      summary: 为指定草稿创建编辑会话
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - collector_id
                - draft_revision
              properties:
                collector_id:
                  type: string
                draft_revision:
                  type: integer
                  minimum: 1
                viewport:
                  $ref: '#/components/schemas/Viewport'
      responses:
        '200':
          description: 幂等重放已有会话状态
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/SessionResponse'
                  request_id:
                    type: string
        '201':
          description: 会话和传输信息
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/SessionResponse'
                  request_id:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      description: >-
        仅 web 入口可创建。默认 viewport 1280×800，TTL 120 秒。同一 owner/key 绑定 collector_id、draft_revision 和规范化 viewport；不同输入返回
        409。网络结果不确定时沿用原 key 重试，终态会话使用新 key。
      x-implementation-status: implemented
  /browser-sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      summary: 会话状态
      responses:
        '200':
          description: 状态
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/SessionResponse'
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
    delete:
      summary: 关闭编辑会话
      responses:
        '204':
          description: 已确认关闭；重复关闭可安全重试
        '401':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      description: 先持久化关闭状态阻止心跳复活。远端释放失败返回可重试的 503，浏览器 TTL 仍会回收遗留页；前端保留会话信息用于重试关闭。
      x-implementation-status: implemented
  /browser-sessions/{session_id}/resume:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      summary: 重新读取仍存在的会话；不创建页面、不重放步骤
      responses:
        '200':
          description: 恢复信息
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/SessionResponse'
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
      description: 服务传输异常返回 disconnected；页面丢失或过期返回 410。resume 不执行动作；需从检查点恢复时明确创建新会话并逐条发送新的命令。
      x-implementation-status: implemented
  /browser-sessions/{session_id}/frame:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - in: query
        name: page_state_id
        required: true
        schema:
          type: string
    get:
      summary: 获取对应页面版本的 PNG 截图，返回 X-Page-State-ID 并禁止缓存
      responses:
        '200':
          description: 画面帧；X-Page-State-ID 与请求一致
          headers:
            X-Page-State-ID:
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      description: 陈旧页面状态返回 409。页面版本覆盖 DOM、导航、滚动、viewport 变化，不保证捕获 canvas、视频和动画的每个像素变化。
      x-implementation-status: implemented
  /browser-sessions/{session_id}/events:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      summary: 认证 SSE 会话状态快照及状态变化
      responses:
        '200':
          description: >-
            event: session，data 为未包裹的 SessionResponse。每条连接从当前快照开始，约每 3 秒检查状态，15 秒 keepalive；事件编号仅连接内递增。无历史持久化，无
            Last-Event-ID 回放，断线重新读取最新状态。 动作回执通过 commands 资源查询；不混入截图或动作重试。
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
  /browser-sessions/{session_id}/inspect:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      summary: 只检查元素，不执行网页点击
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectionRequest'
      responses:
        '200':
          description: 只读检查结果；统一 data/request_id 包裹。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ElementInspection'
                  request_id:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      x-implementation-status: planned
      description: owner 校验与 ready 会话；只读，绝不触发网页动作。旧页面版本返回 409，未确认动作返回 COMMAND_PENDING；不穿透 iframe/Shadow DOM。定位器无效返回 400；暂时忙返回 409。
    x-implementation-status: implemented
  /browser-sessions/{session_id}/locator-checks:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      summary: 验证持久化定位器的命中数量和样本，不执行网页动作
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectionRequest'
      responses:
        '200':
          description: 只读检查结果；统一 data/request_id 包裹。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LocatorInspection'
                  request_id:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      x-implementation-status: planned
      description: owner 校验与 ready 会话；只读，绝不触发网页动作。旧页面版本返回 409，未确认动作返回 COMMAND_PENDING；不穿透 iframe/Shadow DOM。定位器无效返回 400；暂时忙返回 409。
    x-implementation-status: implemented
  /browser-sessions/{session_id}/commands:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      summary: 接受一次明确的编辑动作并返回持久化命令 ID
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
      responses:
        '202':
          description: 命令已登记，可能已经执行完成
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/CommandResult'
                  request_id:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
      description: >-
        返回 202 后 GET 查询回执。每个会话同时最多一个 queued/running/uncertain 命令；相同 owner/session/key 的并发重试返回同一 ID，修改规范化输入返回
        409。输入不确定或进程重启后只查询，绝不自动重发。成功录制按 expected_revision 与动作回执事务提交；草稿冲突保留动作成功回执并报告录制失败。
    get:
      summary: 最近 50 条会话动作日志（跨刷新可查询）
      x-implementation-status: implemented
      responses:
        '200':
          description: 按创建时间倒序的最近回执
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/CommandResult'
                      limit:
                        type: integer
                        example: 50
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /browser-sessions/{session_id}/commands/{command_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - in: path
        name: command_id
        required: true
        schema:
          type: string
    get:
      summary: 查询动作回执；超时/不确定时向浏览器查询结果，不重复执行
      responses:
        '200':
          description: 持久化状态及回执
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/CommandResult'
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
  /browser-sessions/{session_id}/heartbeat:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      summary: 续期可用会话，建议每 20 秒调用；续期 TTL 为 120 秒
      responses:
        '200':
          description: 最新会话状态
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/SessionResponse'
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      x-implementation-status: implemented
  /collectors/{collector_id}/checkpoints:
    parameters:
      - $ref: '#/components/parameters/CollectorId'
    get:
      summary: 当前用户的方案检查点，最多 100 个
      x-implementation-status: implemented
      responses:
        '200':
          description: 快照列表
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/EditorCheckpoint'
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      summary: 将草稿入口与至 through_step_id 的动作前缀保存为不可变快照
      x-implementation-status: implemented
      description: >-
        仅支持 navigate/action，最多 100 步；校验 revision、step_id 唯一及动作参数。前端从新会话入口顺序重放快照；明确确认点击/输入，失败或 uncertain
        停止，不自动恢复重放；不改变草稿或写正式数据。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - expected_revision
                - through_step_id
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 160
                expected_revision:
                  type: integer
                  minimum: 1
                through_step_id:
                  type: string
      responses:
        '201':
          description: 检查点已保存
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - request_id
                properties:
                  data:
                    $ref: '#/components/schemas/EditorCheckpoint'
                  request_id:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /collectors/{collector_id}/checkpoints/{checkpoint_id}:
    parameters:
      - $ref: '#/components/parameters/CollectorId'
      - in: path
        name: checkpoint_id
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: 删除当前用户的方案检查点
      x-implementation-status: implemented
      responses:
        '204':
          description: 已删除
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /browser-sessions/{session_id}/dom:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    x-implementation-status: implemented
    get:
      summary: 按层读取 DOM 子元素，不执行网站动作
      parameters:
        - name: page_state_id
          in: query
          required: true
          schema:
            type: string
        - name: element_id
          in: query
          schema:
            type: string
          description: 省略时读取 documentElement。
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 10000
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
      responses:
        '200':
          description: 只读检查结果；统一 data/request_id 包裹。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DOMChildren'
                  request_id:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /browser-sessions/{session_id}/record-previews:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      summary: 检查当前浏览器页面的已保存记录规则与路径候选，不访问新页面
      description: >-
        owner/revision/page_state 绑定；服务端从该草稿 step_id 读取并严格校验 record_set 配置，不信任请求携带的规则。返回基础字段值、逐记录诊断、来源 bounds、去重详情
        URL、下一页入口；不发起导航或点击、不写正式数据。不等于 B01 的离线字段 previews 或 B04 的完整试采。详情/下一页真实访问复用 commands 并明确确认；默认同 origin，未知结果停止。
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordPreviewRequest'
      responses:
        '200':
          description: 统一包裹的当前页面基础预览
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RecordPreview'
                  request_id:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 沿用现有登录返回的原始 JWT，不添加 Bearer 前缀；也支持 token cookie。
  parameters:
    CollectorId:
      in: path
      name: collector_id
      required: true
      schema:
        type: string
    SessionId:
      in: path
      name: session_id
      required: true
      schema:
        type: string
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        maxLength: 128
  responses:
    Error:
      description: 结构化错误；401/403/404/409/410/503 使用相同结构
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CapabilitiesResponse:
      type: object
      properties:
        editor_protocol:
          type: string
          example: editor.v1
        browser_ready:
          type: boolean
          description: 只有实际浏览器就绪才能声明 true；当前探测不启动浏览器，返回 false。
        supported_actions:
          type: array
          items:
            type: string
        supports_live_inspection:
          type: boolean
        supports_record_preview:
          type: boolean
          description: 额外探测 record-preview 能力；旧 A05 服务返回 false。
        definition_versions:
          type: array
          items:
            type: integer
        reason:
          type: string
        editor_service_connected:
          type: boolean
          description: editor.v1 无副作用探测成功；不保证远程 Chromium 能启动。
    DraftResponse:
      type: object
      required:
        - id
        - revision
        - definition
      properties:
        id:
          type: string
        revision:
          type: integer
          minimum: 1
        definition:
          $ref: '#/components/schemas/Definition'
    Collector:
      type: object
      required:
        - id
        - name
        - entry_url
        - entry_type
        - status
        - revision
        - definition
      properties:
        id:
          type: string
        name:
          type: string
        entry_url:
          type: string
          format: uri
        entry_type:
          type: string
          enum:
            - web
            - json
        status:
          type: string
          enum:
            - draft
            - published
            - archived
        revision:
          type: integer
          minimum: 1
        validation_status:
          type: string
          enum:
            - not_validated
            - valid
            - invalid
            - stale
        validation_errors:
          type: array
          items:
            type: string
        save_summary:
          $ref: '#/components/schemas/SaveSummary'
        definition:
          type: object
    SaveSummary:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
        changed_fields:
          type: array
          items:
            type: string
            enum:
              - name
              - entry_url
              - definition
        saved_at:
          type: string
          format: date-time
    ValidationResult:
      type: object
      required:
        - valid
        - errors
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
    Definition:
      type: object
      required:
        - definition_version
        - entry_url
        - steps
      properties:
        definition_version:
          type: integer
          example: 1
        entry_url:
          type: string
          format: uri
        steps:
          type: array
          items:
            type: object
            required:
              - step_id
              - type
            properties:
              step_id:
                type: string
              type:
                type: string
                enum:
                  - navigate
                  - action
                  - record
                  - detail
                  - next_page
                  - extract
                  - output
              config:
                type: object
                additionalProperties: true
    Viewport:
      type: object
      required:
        - width
        - height
      properties:
        width:
          type: integer
          minimum: 320
          maximum: 3840
        height:
          type: integer
          minimum: 240
          maximum: 2160
    SessionResponse:
      type: object
      required:
        - session_id
        - collector_id
        - draft_revision
        - status
        - expires_at
        - page_state_id
        - current_url
        - viewport
        - frame_url
        - heartbeat_interval_seconds
        - available
        - needs_reopen
      properties:
        session_id:
          type: string
        status:
          type: string
          enum:
            - creating
            - ready
            - disconnected
            - expired
            - closed
            - failed
        expires_at:
          type: string
          format: date-time
        page_state_id:
          type: string
        current_url:
          type: string
        viewport:
          $ref: '#/components/schemas/Viewport'
        collector_id:
          type: string
        draft_revision:
          type: integer
          minimum: 1
        frame_url:
          type: string
        heartbeat_interval_seconds:
          type: integer
          example: 20
        available:
          type: boolean
        needs_reopen:
          type: boolean
    Locator:
      type: object
      required:
        - strategy
        - expression
      properties:
        strategy:
          type: string
          enum:
            - css
            - xpath
        expression:
          type: string
        relative_to:
          type: string
          description: 可选的重复记录容器 step_id
    CommandRequest:
      type: object
      required:
        - page_state_id
        - expected_revision
        - type
      properties:
        page_state_id:
          type: string
          maxLength: 256
        expected_revision:
          type: integer
          minimum: 1
        type:
          type: string
          enum:
            - navigate
            - back
            - forward
            - refresh
            - click
            - input
            - wait
            - scroll
        locator:
          $ref: '#/components/schemas/Locator'
        position:
          type: object
          required:
            - x
            - 'y'
          properties:
            x:
              type: number
              minimum: 0
              maximum: 3840
            'y':
              type: number
              minimum: 0
              maximum: 2160
          description: 仅 click 支持；当前截图 PNG 像素，浏览器按 devicePixelRatio 转为 CSS 坐标；与 locator 互斥。
        value:
          type: string
          maxLength: 4096
          description: navigate 为 URL；普通 input 文本；scroll 为像素整数；无 locator 的 wait 为等待毫秒。密码/验证码/敏感字段输入拒绝；待 D04 凭据支持。input 文本不保存进命令日志。
        timeout_ms:
          type: integer
          minimum: 100
          maximum: 30000
          default: 10000
        confirmed:
          type: boolean
          default: false
          description: click/input 必须显式确认。
        record:
          type: boolean
          default: false
        step_id:
          type: string
          maxLength: 128
          description: record=true 时必填；成功后用于加入草稿。
    CommandResult:
      type: object
      required:
        - command_id
        - session_id
        - status
        - type
        - request
        - result
        - created_at
        - deadline_at
      properties:
        command_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - uncertain
        type:
          type: string
        request:
          $ref: '#/components/schemas/CommandRequest'
        result:
          $ref: '#/components/schemas/EditorActionResult'
        created_at:
          type: string
          format: date-time
        deadline_at:
          type: string
          format: date-time
      description: request 为日志视图，input.value 已移除。result 是动作回执；recording_status 独立表示草稿录制结果，动作已执行但录制冲突不伪装动作失败。
    ErrorResponse:
      type: object
      required:
        - error
        - request_id
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
        request_id:
          type: string
    ErrorBody:
      type: object
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        stage:
          type: string
        step_id:
          type: string
        path:
          type: string
        latest:
          $ref: '#/components/schemas/Collector'
    EditorActionResult:
      type: object
      properties:
        status:
          type: string
          enum:
            - ''
            - running
            - succeeded
            - failed
            - uncertain
        before_page_state_id:
          type: string
        after_page_state_id:
          type: string
        final_url:
          type: string
        duration_ms:
          type: integer
        error_code:
          type: string
        error:
          type: string
        locator:
          $ref: '#/components/schemas/Locator'
        recording_status:
          type: string
          enum:
            - recorded
            - conflict
        recording_error:
          type: string
        recorded_revision:
          type: integer
    EditorCheckpoint:
      type: object
      required:
        - checkpoint_id
        - name
        - draft_revision
        - through_step_id
        - snapshot
        - created_at
      properties:
        checkpoint_id:
          type: string
          format: uuid
        name:
          type: string
        draft_revision:
          type: integer
        through_step_id:
          type: string
        snapshot:
          $ref: '#/components/schemas/Definition'
        created_at:
          type: string
          format: date-time
    InspectionRequest:
      type: object
      required:
        - page_state_id
      properties:
        page_state_id:
          type: string
        position:
          type: object
          required:
            - x
            - 'y'
          description: 当前截图 PNG 像素；浏览器按 devicePixelRatio 转 CSS 坐标。与 element_id 二选一。
          properties:
            x:
              type: number
              minimum: 0
              maximum: 8192
            'y':
              type: number
              minimum: 0
              maximum: 8192
        element_id:
          type: string
          maxLength: 128
          description: 当前文档与页面版本内的临时引用，不作为持久化定位器。
        mode:
          type: string
          enum:
            - record
            - field
          default: record
        relation:
          type: string
          enum:
            - self
            - parent
            - child
          default: self
        child_index:
          type: integer
          minimum: 0
          maximum: 10000
        expand_similar:
          type: boolean
        locator:
          $ref: '#/components/schemas/Locator'
        scope:
          $ref: '#/components/schemas/Locator'
          description: 可选记录容器；字段定位相对每个容器，XPath 使用 . 开头。
        previous_fingerprint:
          type: string
          maxLength: 128
          description: 上次当前规则/范围的命中身份哈希，仅用于比较，不保证未来页面稳定。
    InspectedElement:
      type: object
      properties:
        element_id:
          type: string
        tag:
          type: string
        text:
          type: string
          maxLength: 200
        attributes:
          type: object
          additionalProperties:
            type: string
        bounds:
          type: object
          description: 与 PNG 截图一致的像素坐标，可以落在视口外。
          properties:
            x:
              type: number
            'y':
              type: number
            width:
              type: number
            height:
              type: number
        child_count:
          type: integer
        parent_id:
          type: string
        boundary:
          type: string
          enum:
            - ''
            - iframe
            - shadow-root
    LocatorInspection:
      type: object
      properties:
        page_state_id:
          type: string
        locator:
          $ref: '#/components/schemas/Locator'
        match_count:
          type: integer
          description: 最多统计 1000；truncated 时是数量下限。
        truncated:
          type: boolean
        scope_match_count:
          type: integer
        elements:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/InspectedElement'
        sample_values:
          type: array
          maxItems: 10
          items:
            type: string
        fingerprint:
          type: string
        comparison:
          type: string
          enum:
            - first-check
            - unchanged
            - changed
        warnings:
          type: array
          items:
            type: string
        kind:
          type: string
        warning:
          type: string
    ElementInspection:
      type: object
      properties:
        page_state_id:
          type: string
        element:
          $ref: '#/components/schemas/InspectedElement'
        locators:
          type: array
          items:
            $ref: '#/components/schemas/LocatorInspection'
        warnings:
          type: array
          items:
            type: string
        coordinate_space:
          type: string
          enum:
            - screenshot-pixels
    DOMChildren:
      type: object
      properties:
        page_state_id:
          type: string
        root:
          $ref: '#/components/schemas/InspectedElement'
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/InspectedElement'
        next_offset:
          type: integer
          nullable: true
        total:
          type: integer
        warnings:
          type: array
          items:
            type: string
    RecordFieldRule:
      type: object
      required:
        - name
        - extract
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 64
        locator:
          $ref: '#/components/schemas/Locator'
          description: 重复项字段相对于各自容器；省略则读取容器自身。重复项 XPath 使用 . 开头。详情/单页可使用整页 XPath。
        extract:
          type: string
          enum:
            - text
            - link
            - image
            - attribute
        attribute:
          type: string
          maxLength: 64
          description: attribute 必填，不支持 value 或秘密输入值。
    RecordPlan:
      type: object
      required:
        - mode
        - max_records
        - fields
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
            - single
            - repeated
        locator:
          $ref: '#/components/schemas/Locator'
          description: repeated 必填；single 使用整页，禁止指定容器。
        max_records:
          type: integer
          minimum: 1
          maximum: 20
        fields:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/RecordFieldRule'
        detail:
          type: object
          required:
            - locator
            - return_strategy
            - max_details
          additionalProperties: false
          properties:
            locator:
              $ref: '#/components/schemas/Locator'
            return_strategy:
              type: string
              enum:
                - back
                - navigate-list
            max_details:
              type: integer
              minimum: 1
              maximum: 5
        detail_fields:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/RecordFieldRule'
        next_page:
          type: object
          required:
            - locator
            - kind
            - max_pages
          additionalProperties: false
          properties:
            locator:
              $ref: '#/components/schemas/Locator'
            kind:
              type: string
              enum:
                - link
                - click
            max_pages:
              type: integer
              enum:
                - 2
              description: 编辑验证只访问一次下一页；连续翻页执行属于 C01。
    RecordStep:
      type: object
      required:
        - step_id
        - type
        - config
      properties:
        step_id:
          type: string
        type:
          type: string
          enum:
            - record_set
        config:
          $ref: '#/components/schemas/RecordPlan'
    RecordPreviewRequest:
      type: object
      required:
        - page_state_id
        - expected_revision
        - step_id
        - stage
      properties:
        page_state_id:
          type: string
        expected_revision:
          type: integer
          minimum: 1
        step_id:
          type: string
          maxLength: 128
        stage:
          type: string
          enum:
            - list
            - detail
    RecordPreview:
      type: object
      properties:
        page_state_id:
          type: string
        stage:
          type: string
          enum:
            - list
            - detail
        current_url:
          type: string
        record_match_count:
          type: integer
        truncated:
          type: boolean
        network_accessed:
          type: boolean
          enum:
            - false
        dry_run:
          type: boolean
          enum:
            - true
        warnings:
          type: array
          items:
            type: string
        records:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              index:
                type: integer
              values:
                type: object
                additionalProperties:
                  type: string
              fields:
                type: array
                maxItems: 30
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    value:
                      type: string
                    raw_values:
                      type: array
                      maxItems: 3
                      items:
                        type: string
                    match_count:
                      type: integer
                    truncated:
                      type: boolean
                    errors:
                      type: array
                      items:
                        type: string
                    source:
                      type: object
                      nullable: true
                      description: 当前页面版本内的元素引用与 PNG bounds，用于字段来源高亮。
        detail_urls:
          type: array
          maxItems: 5
          items:
            type: object
            properties:
              record_index:
                type: integer
              raw_url:
                type: string
              url:
                type: string
              error:
                type: string
              source:
                type: object
        next_pages:
          type: array
          maxItems: 5
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                  - link
                  - click
              url:
                type: string
              error:
                type: string
              disabled:
                type: boolean
              source:
                type: object
