    RecordFieldRule:
      type: object
      required:
        - name
        - extract
      additionalProperties: false
      properties:
        field_key:
          type: string
          maxLength: 128
          description: 同页面角色内唯一的稳定键；旧规则省略时回退名称，表单保存时补齐，重命名保留键。
        type:
          type: string
          enum: ['', string, integer, number, boolean, date, datetime, json]
          description: 缺省保持 JSON 原类型/HTML 文本；整数为 int64，JSON 原值保留大整数。
        required:
          type: boolean
        multiple:
          type: boolean
          description: HTML 逐匹配元素转换；JSON Pointer 选数组时逐项转换。单值 HTML 多命中无效。
        clean:
          type: string
          enum: ['', trim, whitespace]
        regex:
          type: string
          maxLength: 512
          description: RE2，清洗后取第一个捕获组或完整匹配；无匹配报错。
        date_format:
          type: string
          maxLength: 64
          description: Go layout；date 缺省 2006-01-02，datetime 缺省 RFC3339；自定义无时区按 UTC。
        name:
          type: string
          maxLength: 64
        locator:
          $ref: '#/components/schemas/Locator'
          description: 重复项字段相对于各自容器；省略则读取容器自身。重复项 XPath 使用 . 开头。详情/单页可使用整页 XPath。
