          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 1024
        body:
          description: POST JSON 值，最多 64 KiB；不支持 GET body；拒绝密码/token 等已知秘密键。
        credential_ref:
          type: string
          example: ${secret:example_api}
          description: 支持部署 ${secret:name} 或新域 ${credential:uuid} 引用；只在运行时解析
        timeout_ms:
          type: integer
          minimum: 100
          maximum: 15000
          default: 10000
    JSONRecordPlan:
      type: object
      additionalProperties: false
      required: [array_pointer, max_records, fields]
      description: json_records 步骤 config；RFC 6901，空字符串选根数组，字段 pointer 相对每条记录。
      properties:
        array_pointer:
          type: string
          maxLength: 2048
        max_records:
          type: integer
          minimum: 1
          maximum: 20
        fields:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/JSONFieldRule'
    CaptureInput:
      type: object
      required: [collector_id, expected_revision, source, format]
      properties:
        collector_id:
          type: string
        expected_revision:
          type: integer
          minimum: 1
        source:
          type: string
          enum: [http, offline]
        format:
          type: string
          enum: [json, html]
        confirmed:
          type: boolean
          description: HTTP 必须 true；离线不要求。
        content:
          type: string
          description: offline 必填，UTF-8 最多 1 MiB；HTTP 不允许传入。日志不保存原始离线内容。
    CaptureEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/InputCapture'
        request_id:
          type: string
    InputCapture:
      type: object
      properties:
        session_id:
          type: string
        page_state_id:
          type: string
        base_url:
          type: string
          description: 浏览器保存 document.baseURI，HTTP/离线为空时从文档 base 标签与 final_url 解析链接。
        capture_id:
          type: string
          format: uuid
        collector_id:
          type: string
        draft_revision:
          type: integer
        source:
          type: string
          enum: [http, offline, browser]
        format:
          type: string
          enum: [json, html]
        status:
          type: string
          enum: [running, succeeded, failed, uncertain]
        final_url:
          type: string
        status_code:
          type: integer
        content_type:
          type: string
        content:
          type: string
          description: 已知秘密键和注入秘密回显做基础脱敏；HTML 移除 script/style 与输入值。不是任意敏感内容检测，保留的是规范化内容。
        content_hash:
          type: string
          description: 保存内容的 SHA256。
        byte_count:
          type: integer
          description: 获取到的响应/离线内容字节数；超限时最多读到 1 MiB+1，可能不同于保存内容长度。
        error_code:
          type: string
        error_stage:
          type: string
        network_accessed:
          type: boolean
          nullable: true
          description: true 表示已尝试网络，false 表示确认未尝试，null 表示执行中/崩溃恢复且未知。
        dry_run:
          type: boolean
          description: 不写正式业务记录；不表示 HTTP/POST 无外部副作用。
        sanitized:
          type: boolean
        created_at:
          type: string
          format: date-time
        deadline_at:
          type: string
          format: date-time
    JSONCaptureCheck:
      type: object
      properties:
        capture_id:
          type: string
        content_hash:
          type: string
        revision:
          type: integer
        match_count:
          type: integer
        truncated:
          type: boolean
        network_accessed:
          type: boolean
          enum: [false]
        dry_run:
          type: boolean
          enum: [true]
        records:
          type: array
