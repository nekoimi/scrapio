<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>scrapio v2.2 · 阶段 0 交互原型</title>
<style>
:root{font:14px/1.5 Inter,"Microsoft YaHei",sans-serif;color:#18243b;background:#f3f5f9}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8db4ff;outline-offset:2px}.app{min-height:100vh;display:flex}.side{width:216px;background:#14223d;color:#d9e3f7;padding:24px 14px;flex:none}.brand{font-size:21px;font-weight:750;letter-spacing:.2px;padding:0 10px 22px}.brand small{display:block;font-size:11px;color:#9cadc9;font-weight:400;margin-top:4px}.side button{width:100%;text-align:left;border:0;background:transparent;color:inherit;padding:11px 13px;border-radius:9px;margin:2px 0}.side button.active{background:#edf3ff;color:#204bad;font-weight:700}.side .foot{font-size:12px;color:#9cadc9;margin:28px 10px}.main{min-width:0;flex:1;padding:24px 28px}.banner{border:1px solid #e7cc85;background:#fff8e6;color:#644c15;padding:9px 14px;border-radius:9px;margin-bottom:18px;font-size:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top h1{font-size:25px;margin:0}.muted{color:#64748b}.small{font-size:12px}.card{background:#fff;border:1px solid #e0e6ef;border-radius:13px;box-shadow:0 3px 16px #16274308}.pad{padding:20px}.primary{background:#315fd1;color:#fff;border:1px solid #315fd1;border-radius:8px;padding:9px 14px;font-weight:650}.quiet{background:#fff;border:1px solid #cbd6e7;color:#284263;border-radius:8px;padding:9px 14px}.warn{background:#fff5e7;border-color:#f2d2a2;color:#8a5805}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grow{flex:1}.field{border:1px solid #cbd6e7;border-radius:8px;padding:10px 12px;min-width:0;background:#fff}.wide{width:min(650px,100%)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{font-size:25px;font-weight:750}.link{border:0;background:transparent;color:#2459bd;padding:0;text-align:left}.status{display:inline-block;border-radius:99px;background:#e9f0ff;color:#2853a7;padding:3px 9px;font-size:12px}.status.good{background:#e8f7ed;color:#207146}.status.bad{background:#fff0ee;color:#a5352d}.studio{display:grid;grid-template-columns:225px minmax(400px,1fr) 284px;gap:12px;min-height:550px}.studio .card{min-width:0}.studio-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.step{width:100%;display:flex;justify-content:space-between;text-align:left;border:0;border-bottom:1px solid #eef1f6;background:#fff;padding:12px;color:#263651}.step.current{background:#eff4ff;color:#2455bb;font-weight:700}.canvas{background:#f8fafd;display:flex;flex-direction:column}.browserbar{padding:10px;border-bottom:1px solid #e0e6ef;display:flex;gap:6px}.browserbar .field{flex:1;padding:6px 9px}.mode{padding:9px 12px;border-bottom:1px solid #e0e6ef;display:flex;gap:6px;flex-wrap:wrap}.mode button{border:1px solid #cbd6e7;border-radius:7px;background:#fff;padding:5px 9px;color:#405674}.mode button.active{background:#dce9ff;color:#1849b0;border-color:#8eaff1}.fakepage{margin:14px;background:#fff;border:1px solid #dce3ec;border-radius:9px;padding:18px;flex:1;overflow:auto}.fakepage h2{margin:0 0 5px}.movie{display:grid;grid-template-columns:42px 1fr auto;gap:10px;border-bottom:1px solid #e9edf4;padding:14px 5px;align-items:center}.movie:last-of-type{border:0}.poster{background:#dce5f7;height:54px;border-radius:5px;display:grid;place-items:center;color:#5c7094}.selectable:hover,.selected{outline:2px solid #4782ef;outline-offset:3px;border-radius:4px}.movie-title{font-weight:700;font-size:16px}.movie-desc{color:#68788e;font-size:12px}.inspector{padding:16px}.inspector h3{margin:0 0 12px}.inspector .field{width:100%;margin:7px 0}.preview{margin-top:12px;overflow:auto}.preview table{border-collapse:collapse;width:100%;min-width:520px}.preview th,.preview td{text-align:left;padding:10px;border-bottom:1px solid #e9edf4}.notice{border-radius:8px;background:#f0f5ff;padding:10px;color:#284a84;margin:10px 0}.spacer{height:15px}.hidden{display:none!important}@media(max-width:1050px){.studio{grid-template-columns:180px 1fr}.inspector{grid-column:1/-1}.side{width:160px}.main{padding:16px}}@media(max-width:690px){.app{display:block}.side{width:100%;display:flex;align-items:center;overflow:auto;padding:8px}.brand{font-size:17px;white-space:nowrap;padding:8px}.brand small,.side .foot{display:none}.side button{width:auto;white-space:nowrap}.grid,.grid.two,.studio{grid-template-columns:1fr}.studio{min-height:0}.inspector{grid-column:auto}.fakepage{min-height:310px}.main{padding:14px}.top{align-items:flex-start}}
</style>
</head>
<body><div class="app"><aside class="side"><div class="brand">scrapio<small>v2.2 · 可视化采集</small></div><nav id="nav"><button data-page="home" class="active">⌂　首页</button><button data-page="collectors">▤　采集方案</button><button data-page="data">▦　数据</button><button data-page="runs">▷　运行</button><button data-page="settings">⚙　设置</button></nav><div class="foot">阶段 0 可点击原型</div></aside><main class="main"><div class="banner">演示原型：网页内容、采集结果和浏览器动作均为模拟数据；不会访问目标站点、写入数据库或执行真实采集。</div><div id="screen"></div></main></div>
<script>
const state={page:'home',url:'https://movie.douban.com/top250',mode:'browse',step:0,selection:'',fields:[],actions:[],trial:false,published:false,run:false};
const movies=[['肖申克的救赎','1994 · 剧情','https://movie.douban.com/subject/1292052/'],['霸王别姬','1993 · 剧情','https://movie.douban.com/subject/1291546/'],['阿甘正传','1994 · 剧情','https://movie.douban.com/subject/1292720/']];
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(name,action,kind='quiet')=>`<button class="${kind}" data-action="${action}">${name}</button>`;
function page(name){state.page=name;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));render()}
function layout(title,body,actions=''){return `<div class="top"><div><h1>${title}</h1><div class="muted small">${state.page==='studio'?'方案 / 豆瓣 Top 250 / 草稿':'scrapio · v2.2'}</div></div><div class="row">${actions}</div></div>${body}`}
function home(){return layout('把网页变成你的数据',`<section class="card pad"><h2>从一个目标开始</h2><p class="muted">打开网页，在页面上选择记录和字段，再确认将保存的数据。</p><div class="row"><input id="start-url" class="field wide" value="${escapeHTML(state.url)}" aria-label="目标 URL">${btn('开始采集','start','primary')}</div><p class="small muted">网页 · JSON 接口 · 粘贴样例。当前原型只演示网页路径。</p></section><div class="spacer"></div><div class="grid"><section class="card pad"><div class="muted">未完成草稿</div><div class="metric">1</div>${btn('继续配置','studio')}</section><section class="card pad"><div class="muted">数据表</div><div class="metric">${state.run?'1':'0'}</div>${btn('查看数据','data')}</section><section class="card pad"><div class="muted">需要处理</div><div class="metric">0</div><span class="small muted">尚无历史基线</span></section></div>`)}
function studio(){let rows=movies.map((m,i)=>`<div class="movie selectable ${state.selection==='movie-'+i?'selected':''}" data-pick="movie-${i}"><div class="poster">${i+1}</div><div><div class="movie-title selectable" data-pick="title-${i}">${m[0]}</div><div class="movie-desc">${m[1]}</div><a href="#" data-pick="detail-${i}">查看详情</a></div><span class="small muted">Top ${i+1}</span></div>`).join('');let choices=state.selection?`<div class="notice">已选择：${escapeHTML(state.selection)}。本原型只模拟规则建议。</div><div class="row">${btn('作为重复记录','record')}${btn('提取标题','field')}${btn('作为详情链接','detail')}</div>`:'<p class="muted">切换“选择记录”或“选择字段”，然后点击页面中的内容。</p>';let steps=['打开页面','操作页面','找到记录','提取字段','保存数据','测试与发布','定时运行'];return layout('豆瓣 Top 250',`<div class="studio"><div class="card"><div class="pad"><strong>采集步骤</strong><div class="small muted">草稿 · 自动保存示意</div></div>${steps.map((s,i)=>`<button class="step ${state.step===i?'current':''}" data-step="${i}"><span>${i+1}. ${s}</span><span>${i<2?'✓':'·'}</span></button>`).join('')}<div class="pad small muted">操作：${state.actions.length} 步 · 字段：${state.fields.length} 个</div></div><div class="card canvas"><div class="browserbar">${btn('↻','refresh')}<input class="field" value="${escapeHTML(state.url)}" aria-label="当前页面 URL" readonly></div><div class="mode">${[['browse','浏览网页'],['record','选择记录'],['field','选择字段'],['action','录制操作']].map(([key,label])=>`<button data-mode="${key}" class="${state.mode===key?'active':''}">${label}</button>`).join('')}</div><div class="fakepage"><h2>豆瓣电影 Top 250</h2><div class="small muted">演示页面 · 模拟 3 条重复记录；真实页面当前观测约 25 条/页</div>${rows}<p>${btn('下一页 ›','next')}</p></div></div><div class="card inspector"><h3>当前选择</h3>${choices}<hr><h3>规则与结果</h3><div class="small muted">已定义字段</div>${state.fields.length?state.fields.map(f=>`<div class="notice">${escapeHTML(f)}　<span class="status good">3 个样本命中</span></div>`).join(''):'<p class="small muted">尚未选择字段</p>'}<div class="small muted">录制步骤</div>${state.actions.length?state.actions.map(a=>`<div class="notice">${escapeHTML(a)}</div>`).join(''):'<p class="small muted">无</p>'}</div></div><div class="card pad preview"><div class="row"><strong>数据预览</strong><span class="status">仅演示 · 不写正式数据</span></div><table><thead><tr><th>标题</th><th>年份</th><th>预计处理</th></tr></thead><tbody>${movies.map(m=>`<tr><td>${m[0]}</td><td>${m[1].slice(0,4)}</td><td>${state.trial?'预计新增':'待试采'}</td></tr>`).join('')}</tbody></table></div>`,`${btn('返回方案','collectors')}${btn('保存草稿','save')}${btn('有界试采','trial','primary')}${btn('发布','publish')}`)}
function collectors(){return layout('采集方案',`<section class="card pad"><div class="row"><strong>豆瓣 Top 250</strong><span class="status ${state.published?'good':''}">${state.published?'已发布 v1':'草稿'}</span><span class="muted">目标：电影资料</span></div><p class="small muted">${escapeHTML(state.url)} · ${state.fields.length} 个字段 · ${state.actions.length} 个动作</p><div class="row">${btn('继续配置','studio','primary')}${btn('运行一次','run')}${btn('查看数据','data')}</div></section>`,btn('新建采集','home','primary'))}
function data(){return layout('数据',state.run?`<section class="card pad"><h2>电影资料 <span class="status good">3 条演示记录</span></h2><p class="muted">数据为原型模拟；真实记录应包含来源页面、运行与方案版本。</p><div class="preview"><table><thead><tr><th>标题</th><th>详情链接</th><th>来源</th></tr></thead><tbody>${movies.map(m=>`<tr><td>${m[0]}</td><td>${m[2]}</td><td>演示运行 v1</td></tr>`).join('')}</tbody></table></div></section>`:`<section class="card pad"><h2>尚无正式数据</h2><p class="muted">从网页创建方案，试采、发布并正式运行后，这里会出现记录。</p>${btn('返回采集方案','studio','primary')}</section>`)}
function runs(){return layout('运行',state.run?`<section class="card pad"><h2>演示运行 <span class="status good">模拟完成</span></h2><div class="grid"><div><div class="metric">3</div>发现记录</div><div><div class="metric">3</div>模拟新增</div><div><div class="metric">0</div>模拟失败</div></div><p class="muted">原型没有发起真实网络任务或写入数据库。</p>${btn('查看数据','data')}</section>`:`<section class="card pad"><h2>尚无运行</h2><p class="muted">正式运行固定一个已发布版本。</p>${btn('去发布方案','studio','primary')}</section>`)}
function settings(){return layout('设置',`<section class="card pad"><h2>浏览器服务</h2><p class="muted">阶段 0 原型不连接 scrapio-browser。实际服务能力、会话状态和资源限制将在接口联调后显示。</p><span class="status bad">未连接 · 演示模式</span></section>`)}
function render(){document.getElementById('screen').innerHTML=({home,studio,collectors,data,runs,settings}[state.page]||home)()}
function act(name){if(name==='start'){state.url=document.getElementById('start-url')?.value||state.url;page('studio')}else if(['home','studio','collectors','data','runs','settings'].includes(name))page(name);else if(name==='record'){state.step=2;state.mode='record';state.selection='重复记录（3 个样本）';render()}else if(name==='field'){state.step=3;state.fields=['title'];state.selection='标题字段';render()}else if(name==='detail'){state.step=2;state.selection='详情链接（3 个样本）';render()}else if(name==='next'){if(state.mode==='action')state.actions.push('点击下一页（演示）');state.step=2;state.selection='下一页链接';render()}else if(name==='refresh'){state.selection='';render()}else if(name==='save'){alert('演示：草稿状态已保留在本页内存，未发送服务端。')}else if(name==='trial'){state.trial=true;state.step=5;render();alert('演示：有界试采已生成 3 条候选，未访问网站、未写数据库。')}else if(name==='publish'){if(!state.fields.length||!state.trial){alert('演示发布检查：请先选择字段并执行试采。');return}state.published=true;render();alert('演示：已发布 v1。此操作未写服务端。')}else if(name==='run'){if(!state.published){alert('请先在工作台发布。');return}state.run=true;page('runs')} }
document.addEventListener('click',event=>{let nav=event.target.closest('#nav [data-page]');if(nav){page(nav.dataset.page);return}let mode=event.target.closest('[data-mode]');if(mode){state.mode=mode.dataset.mode;render();return}let step=event.target.closest('[data-step]');if(step){state.step=Number(step.dataset.step);render();return}let pick=event.target.closest('[data-pick]');if(pick){event.preventDefault();if(state.mode==='browse'){alert('浏览模式：真实产品会操作网页；本原型请切换选择模式。');return}state.selection=pick.dataset.pick;if(state.mode==='action')state.actions.push('点击 '+pick.dataset.pick+'（演示）');render();return}let button=event.target.closest('[data-action]');if(button){event.preventDefault();act(button.dataset.action)}});
render();
</script></body></html>
