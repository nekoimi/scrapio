<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>scrapio · 独立采集器与任务编排 O0</title>
<style>
:root{--blue:#4567c4;--ink:#22293a;--muted:#647086;--border:#e4e8ef;--bg:#f5f6f8}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:14px/1.6 Inter,'Microsoft YaHei',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;background:#fff;color:var(--ink);border:1px solid #d5dce8;border-radius:8px;padding:9px 15px}button:hover{border-color:var(--blue);color:var(--blue)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.primary:hover{color:#fff;background:#3855a8}a{color:var(--blue)}input,select,textarea{width:100%;border:1px solid #d5dce8;border-radius:8px;background:#fff;padding:10px;color:var(--ink)}textarea{min-height:110px;resize:vertical;font:13px/1.5 Consolas,monospace}label{display:block;font-weight:600;margin-bottom:6px}h1{font-size:27px;line-height:1.3;margin:0 0 12px}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}p{margin:7px 0 15px}.muted,small{color:var(--muted)}.app{height:100dvh;display:flex;overflow:hidden}.side{width:205px;flex-shrink:0;background:#172239;color:#c4cede;padding:28px 16px;display:flex;flex-direction:column;gap:6px}.brand{font-size:23px;color:#fff;font-weight:700;margin:0 12px 25px}.side button{text-align:left;background:transparent;border:0;color:#c4cede}.side button.active{background:#30466e;color:#fff}.side small{margin:auto 12px 0;color:#a8b8d3}.main{flex:1;min-width:0;min-height:0;overflow:auto}.top{padding:17px 30px;background:#fff;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px}.mock{color:#9a691b;font-size:12px}.page{max-width:1220px;margin:auto;padding:32px}.heading,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.card{background:#fff;border:1px solid var(--border);border-radius:13px;padding:24px;margin-bottom:18px;box-shadow:0 2px 10px #17223905}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.split{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(350px,1.2fr);gap:20px}.status{display:inline-block;padding:3px 10px;background:#edf1fa;border-radius:6px;color:#4567c4;font-size:12px}.warn{background:#fff6e6;color:#9a691b}.bad{background:#fff0f0;color:#af3e42}.good{background:#eef7f2;color:#287858}.notice{border-left:3px solid var(--blue);background:#eef2fb;padding:12px 15px;margin:15px 0;border-radius:4px}.stage{border:1px solid var(--border);padding:16px;border-radius:10px;background:#fff;width:100%;text-align:left;display:block}.stage.selected{border:2px solid var(--blue);padding:15px}.connector{padding:8px 24px;font-size:12px;color:var(--muted)}table{border-collapse:collapse;width:100%;text-align:left}th,td{border-bottom:1px solid var(--border);padding:11px 8px;vertical-align:top;overflow-wrap:anywhere}th{background:#f8f9fc;font-size:12px}.table{overflow:auto}code,pre{font-family:Consolas,monospace;font-size:12px}pre{background:#f8f9fc;border:1px solid var(--border);padding:14px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:250px;overflow:auto}.form{display:grid;gap:14px}.tabs{display:flex;gap:8px;margin-bottom:20px}.sample-site{padding:24px;background:#fafbfc;border:1px solid var(--border);border-radius:10px;min-height:155px}.metric{font-size:28px;font-weight:700}.empty{text-align:center;padding:35px}.error{color:#af3e42}.foot{font-size:12px;color:var(--muted);margin-top:20px}dialog{width:460px;max-width:calc(100vw - 32px);border:1px solid var(--border);border-radius:13px;padding:24px;color:var(--ink);box-shadow:0 20px 70px #17223933}dialog::backdrop{background:#17223966}dialog .actions{justify-content:flex-end;margin-top:22px}.field-key{font-family:Consolas,monospace}.toast{padding:12px 18px;background:#eef2fb;color:#334f98;border-radius:8px;margin-bottom:16px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}@media(max-width:850px){.split,.grid{grid-template-columns:1fr}.side{width:150px}.page{padding:22px}.heading{align-items:flex-start;flex-direction:column}}@media(max-width:540px){.side{width:90px;padding:16px 7px}.brand{font-size:16px;margin:0 4px 14px}.side button{padding:10px 5px;font-size:12px}.side small{margin-left:4px;font-size:10px}.top{padding:12px}.page{padding:15px}.card{padding:16px}}
</style></head><body>
<div class="app"><aside class="side"><div class="brand">scrapio</div><nav id="navigation" aria-label="主导航"></nav><small>O0 契约原型<br>全部数据为模拟<br>未连接浏览器/API</small></aside><main class="main" id="main" tabindex="-1"><header class="top"><strong>独立采集器 · 编排任务</strong><span class="mock">离线原型 · 不访问网站、不写数据库</span></header><div class="page" id="view"></div></main></div>
<dialog id="confirmation" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><p id="dialog-body"></p><div class="actions"><button data-action="dialog-cancel">取消</button><button class="primary" data-action="dialog-confirm">确认</button></div></dialog>
<script>
(() => {
 const names={home:'首页',tasks:'任务',collectors:'采集器',data:'数据',runs:'运行'};
 const examples={ranking:{url:'https://fixture.example.test/top250'},movie:{url:'https://fixture.example.test/subject/m001',movie_id:'m001'},comment:{url:'https://fixture.example.test/subject/m001/comments',movie_id:'m001'}};
 const outputs={ranking:[{movie_id:'m001',title:'示例电影一',rank:1,detail_url:'https://fixture.example.test/subject/m001'},{movie_id:'m002',title:'示例电影二',rank:2,detail_url:'https://fixture.example.test/subject/m002'}],movie:[{movie_id:'m001',title:'示例电影一',rating:9.2,comments_url:'https://fixture.example.test/subject/m001/comments'}],comment:[{movie_id:'m001',comment_id:'c001',author:'用户甲',content:'人工样例评论一'},{movie_id:'m001',comment_id:'c002',author:'用户乙',content:'人工样例评论二'}]};
 const specs={ranking:{name:'榜单采集器',fields:['movie_id','title','rank','detail_url'],pages:2},movie:{name:'电影详情采集器',fields:['movie_id','title','rating','comments_url'],pages:1},comment:{name:'短评采集器',fields:['movie_id','comment_id','author','content'],pages:2}};
 const state={page:'home',collector:'movie',stage:'movie',taskMode:'triple',singleCollector:'comment',revision:1,mapping:'detail_url',commentMapping:'comments_url',sampleInput:JSON.stringify(examples.movie,null,2),tested:{},trial:null,published:false,run:null,data:{},scenario:'partial',notice:'',dialog:null,selectedRecord:false};
 const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const btn=(label,action,primary=false,extra='')=>`<button ${extra} class="${primary?'primary':''}" data-action="${action}">${label}</button>`;
 const badge=(label,kind='')=>`<span class="status ${kind}">${label}</span>`;
 const json=value=>`<pre>${esc(JSON.stringify(value,null,2))}</pre>`;
 const stages=()=>state.taskMode==='triple'?['ranking','movie','comment']:[state.singleCollector];
 function inputForStage(id){if(id==='ranking')return examples.ranking;if(id==='movie')return {url:outputs.ranking[0][state.mapping],movie_id:'m001'};return {url:outputs.movie[0][state.commentMapping],movie_id:'m001'};}
 function mappingError(){if(state.taskMode==='single')return '';const u=inputForStage(state.stage==='ranking'?'movie':state.stage).url;return typeof u==='string'&&/^https:\/\//.test(u)?'':'映射错误：url 需要 HTTP(S) 地址，请选择链接字段。错误位于 '+state.stage+' / input.url。';}
 function invalidate(){state.revision++;state.trial=null;state.published=false;state.notice='任务草稿已变化，需重新试采和发布。';}
 function requestConfirm(title,text,action){state.dialog={title,text,action};document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').textContent=text;document.getElementById('confirmation').showModal();}
 function closeDialog(){document.getElementById('confirmation').close();state.dialog=null;}
 function render(){document.getElementById('navigation').innerHTML=Object.entries(names).map(([id,n])=>`<button class="${state.page===id?'active':''}" data-action="nav:${id}">${n}</button>`).join('');document.getElementById('view').innerHTML=(state.notice?`<div class="toast" role="status">${esc(state.notice)}</div>`:'')+views[state.page]();}
 const table=rows=>!rows.length?'<p class="muted">当前范围没有输出。</p>':`<div class="table"><table><thead><tr>${Object.keys(rows[0]).map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${Object.keys(rows[0]).map(k=>`<td>${esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
 const views={
 home:()=>`<div class="heading"><div><h1>从采集能力，到完整任务</h1><p class="muted">为一种输入制作采集器，再用任务连接业务阶段。</p></div>${btn('新建任务','new-task',true)}</div><div class="grid"><section class="card"><h2>豆瓣榜单更新 · 模拟任务</h2><p>榜单 → 电影详情 → 短评</p>${badge(state.published?'模拟已发布':'草稿')}<p class="muted">三个独立采集器 · 三张业务表</p>${btn('配置任务','nav:tasks')}</section><section class="card"><h2>采集器库</h2><p>榜单、电影详情、短评都能直接用一条输入测试。</p>${btn('制作或测试采集器','nav:collectors')}</section></div><section class="card"><h2>需要处理</h2><p>${state.run?'查看模拟阶段范围、失败或受限原因。':'暂无实际运行。原型用于核对模型与操作顺序。'}</p>${btn('查看运行','nav:runs')}</section>`,
 collectors:()=>`<div class="heading"><div><h1>${specs[state.collector].name}</h1><p class="muted">输入 → 获取/操作 → 提取 → 分页 → 输出；无需先打开列表页。</p></div>${btn('创建单阶段正式任务','single',true)}</div><div class="tabs">${Object.entries(specs).map(([id,s])=>btn(s.name,'collector:'+id,state.collector===id)).join('')}</div><div class="split"><section class="card form"><h2>① 样例输入</h2><label for="sample-input">结构化输入</label><textarea id="sample-input">${esc(state.sampleInput)}</textarea><small>地址是保留域名；测试只显示固定合成样例。</small>${btn('测试这一条输入','test-collector',true)}<h2>② 获取与有界分页</h2><p>浏览器 · 当前页记录<br>最大 ${specs[state.collector].pages} 页 / 10 条</p><p class="muted">movie_id 来自输入并显式透传；链接作为普通输出字段。</p></section><section class="card"><h2>③ 当前页与输出契约</h2><div class="sample-site"><strong>模拟网页，非截图/实时浏览器</strong><p>${state.collector==='movie'?'示例电影一 · 评分 9.2':state.collector==='comment'?'用户甲：人工样例评论一':'1. 示例电影一　2. 示例电影二'}</p><p class="muted">没有固定“详情字段”和“返回列表”配置。</p></div><p>字段：${specs[state.collector].fields.map(k=>`<code>${k}</code>`).join(' · ')}</p>${state.tested[state.collector]?table(outputs[state.collector]):'<p class="muted">先测试样例输入，查看当前页结果。</p>'}<p>${badge(state.tested[state.collector]?'当前页样例已检查，分页未覆盖':'尚未测试','warn')}</p>${btn('发布采集器版本（模拟）','publish-collector',false,state.tested[state.collector]?'':'disabled')}</section></div>`,
 tasks:()=>`<div class="heading"><div><h1>${state.taskMode==='triple'?'榜单 → 电影详情 → 短评':'单阶段 · '+specs[state.singleCollector].name}</h1><p class="muted">任务 revision ${state.revision} · ${state.published?'模拟已发布':'草稿'} · ${stages().length} 阶段</p></div><div class="actions">${btn('试采','trial',true)}${btn('发布任务','publish-task',false,state.trial?'':'disabled')}${btn('正式运行（模拟）','run',false,state.published?'':'disabled')}</div></div><div class="split"><section><div class="card"><h2>任务输入</h2><p>${state.taskMode==='triple'?'手动入口：Top250合成地址':'直接处理指定输入；不执行其他阶段'}</p>${json(state.taskMode==='triple'?examples.ranking:examples[state.singleCollector])}${btn(state.taskMode==='triple'?'改为单阶段评论任务':'改为三阶段任务','toggle-task')}</div>${stages().map((id,i)=>`${i?'<div class="connector">↓ 本次规范输出 → 输入映射</div>':''}<button class="stage ${state.stage===id?'selected':''}" data-action="stage:${id}"><h3>${i+1}. ${specs[id].name}</h3><span class="muted">固定版本 v1 · ${id}表</span></button>`).join('')}</section><section class="card"><h2>阶段：${specs[state.stage].name}</h2><p>采集器 v1 ${btn('编辑采集器','edit-stage')}</p><h3>输入映射</h3>${state.taskMode==='triple'&&state.stage!=='ranking'?`<label for="url-source">url ← 上游输出字段</label><select id="url-source">${(state.stage==='movie'?['detail_url','title','movie_id']:['comments_url','title','movie_id']).map(k=>`<option ${k===(state.stage==='movie'?state.mapping:state.commentMapping)?'selected':''}>${k}</option>`).join('')}</select><p><code>movie_id ← output.movie_id</code></p>${btn('检查映射','check-mapping')}<p class="${mappingError()?'error':'muted'}">${esc(mappingError()||'映射合法 · 链接非空才产生下游工作项')}</p>`:'<p>来自冻结的任务入口输入。</p>'}<h3>实际样例输入</h3>${json(state.taskMode==='single'?examples[state.singleCollector]:inputForStage(state.stage))}<h3>结果保存</h3><p>${state.stage}表 · Schema 1 · 唯一键 ${state.stage==='comment'?'movie_id + comment_id':'movie_id'}</p><p class="muted">缺失不覆盖旧值；unchanged 有效输出仍传到下游。</p>${btn('模拟空链接过滤','filter')}${btn('模拟保存冲突','conflict')}<div class="notice">此页只编排输入、版本和保存目标；字段提取在独立采集器中修改。</div></section></div>${state.trial?`<section class="card"><h2>试采结果 ${badge('有界 / 未覆盖','warn')}</h2><p>冻结 revision ${state.trial.revision} · 正式写入 0 · 下游使用试采输出。</p><p>仅m001详情与短评第一页有合成证据；m002及下一页未覆盖，不能报告完整通过。</p>${table(outputs[state.stage])}</section>`:''}`,
 runs:()=>!state.run?`<h1>运行</h1><section class="card empty"><h2>暂无运行</h2><p class="muted">先配置任务、试采与发布。原型不创建真实服务任务。</p>${btn('去配置任务','nav:tasks',true)}</section>`:`<div class="heading"><div><h1>模拟运行 R001 ${badge(state.run.status,'warn')}</h1><p class="muted">固定任务版本 v1 · ${state.run.scope} · 已提交的数据保留</p></div>${btn('查看数据','nav:data')}</div><section class="card"><h2>阶段进度</h2><div class="table"><table><thead><tr><th>阶段</th><th>输入</th><th>有效输出</th><th>结果 / 原因</th></tr></thead><tbody>${stages().map(id=>`<tr><td>${specs[id].name}</td><td>${id==='ranking'?1:2}</td><td>${outputs[id].length}</td><td>${id==='movie'?(state.taskMode==='triple'?'1成功 / 1失败：模拟获取超时':'当前输入成功；其他阶段未执行'):id==='comment'?'limited：短评下一页未覆盖':'当前页完成 / 翻页未覆盖'}</td></tr>`).join('')}</tbody></table></div><p class="muted">数量分别表示输入与产出，不要求跨阶段相等。</p><div class="actions">${btn('查看失败输入','failure')}${btn('仅补采失败输入','replay',true)}${btn('模拟未知动作','unknown')}${btn('模拟等待上游','waiting')}${btn('模拟容量暂停','capacity')}</div></section><section class="card"><h2>来源与恢复</h2><p>榜单记录m001 → 电影详情工作项 → 短评工作项 → c001/c002。</p><p>补采会创建新的运行，保持原输入快照与原版本；不把旧失败项改成正在执行。</p>${state.run.replay?'<p class="notice">模拟补采 R002 已创建；只包含失败电影输入，榜单阶段未执行，不能当作全流程回归通过。</p>':''}</section>`,
 data:()=>`<h1>业务数据表</h1><p class="muted">仅显示本原型模拟正式输出；试采不会出现在这里。</p>${Object.keys(state.data).length?Object.entries(state.data).map(([id,rows])=>`<section class="card"><h2>${id}表 ${badge('模拟数据')}</h2>${table(rows)}${id==='movie'?`<div class="actions">${btn('选择第一部电影','select-record')}${btn('交给短评采集器处理','from-table',true,state.selectedRecord?'':'disabled')}${btn('查看来源链','lineage')}</div>`:''}</section>`).join(''):`<section class="card empty"><h2>尚无正式输出</h2><p>采集器测试和任务试采只有候选；正式运行后显示模拟表数据。</p>${btn('去配置任务','nav:tasks')}</section>`}`
 };
 function command(action,payload){
  state.notice='';
  if(action.startsWith('nav:')){state.page=action.split(':')[1];render();return;}
  if(action.startsWith('collector:')){state.collector=action.split(':')[1];state.sampleInput=JSON.stringify(examples[state.collector],null,2);state.page='collectors';}
  else if(action.startsWith('stage:'))state.stage=action.split(':')[1];
  else if(action==='new-task'){state.page='tasks';state.taskMode='triple';state.stage='movie';}
  else if(action==='single'||action==='from-table'){state.page='tasks';state.taskMode='single';state.singleCollector=action==='single'?state.collector:'comment';state.stage=state.singleCollector;invalidate();}
  else if(action==='toggle-task'){state.taskMode=state.taskMode==='triple'?'single':'triple';state.singleCollector='comment';state.stage=state.taskMode==='single'?'comment':'movie';invalidate();}
  else if(action==='edit-stage'){state.collector=state.stage;state.sampleInput=JSON.stringify(examples[state.collector],null,2);state.page='collectors';}
  else if(action==='test-collector'){
   try{state.sampleInput=payload||document.getElementById('sample-input').value;const x=JSON.parse(state.sampleInput);if(!x||typeof x.url!=='string'||!/^https:\/\//.test(x.url)||(state.collector!=='ranking'&&typeof x.movie_id!=='string'))throw Error('需要有效 url；电影/短评输入还需要 movie_id。');if(Object.keys(x).some(k=>!Object.hasOwn(examples[state.collector],k))||Object.entries(examples[state.collector]).some(([k,v])=>x[k]!==v))throw Error('当前原型仅有预填输入的固定证据；其他输入尚未覆盖。');state.tested[state.collector]=true;state.notice='模拟测试完成，仅使用固定当前页证据，未访问输入网址。';}
   catch(e){state.tested[state.collector]=false;state.notice='样例输入无效：'+e.message;}
  }
  else if(action==='publish-collector'){if(!state.tested[state.collector])return;requestConfirm('发布采集器（模拟）','冻结输入/输出与规则；不绑定正式表。这里不向服务端发布。','accept-collector');}
  else if(action==='accept-collector')state.notice='模拟采集器 v1 已发布，可被任务阶段引用。';
  else if(action==='check-mapping'){const k=payload||document.getElementById('url-source').value;if(state.stage==='movie')state.mapping=k;else state.commentMapping=k;invalidate();state.notice=mappingError()||'样例映射合法，保存后的任务需重新试采。';}
  else if(action==='trial'){if(mappingError()){state.notice=mappingError();}else{state.trial={revision:state.revision,writes:0,coverage:'limited'};state.notice='模拟试采有界完成；无正式写入，m002详情和下一页未覆盖。';}}
  else if(action==='publish-task'){if(!state.trial||state.trial.revision!==state.revision){state.notice='先对当前revision试采。';}else requestConfirm('接受有界证据并模拟发布','本原型只有部分页面证据，发布不代表完整覆盖。真实产品需按发布策略核对未覆盖范围。','accept-task');}
  else if(action==='accept-task'){state.published=true;state.notice='模拟任务 v1 已发布，实际服务未执行该操作。';}
  else if(action==='run'){if(!state.published){state.notice='需要先发布任务。';}else requestConfirm('模拟正式运行','将模拟结果加入本页内存数据表，展示部分失败；不访问网站或写数据库。','accept-run');}
  else if(action==='accept-run'){state.run={status:state.taskMode==='triple'?'partial':state.singleCollector==='movie'?'succeeded':'limited',scope:state.taskMode==='triple'?'完整三阶段 / 有界':'仅 '+specs[state.singleCollector].name,replay:false};state.data=Object.fromEntries(stages().map(id=>[id,outputs[id]]));state.page='runs';}
  else if(action==='failure')requestConfirm('电影详情输入获取失败','阶段 movie，工作项 w-m002，input.url=https://fixture.example.test/subject/m002；可补采该输入，其他电影结果保留。','ack');
  else if(action==='replay'){if(state.run)requestConfirm('只补采失败输入','新运行使用原冻结输入和原版本，可能再次访问网站及更新业务记录；榜单不重跑。原型仅模拟。','accept-replay');}
  else if(action==='accept-replay'){state.run.replay=true;state.notice='模拟补采 R002：原版本、失败输入；原运行结果保持。';}
  else if(action==='unknown')requestConfirm('动作结果未知 · awaiting_confirmation','阶段 comment / click-next / command c-original。先查询原回执，禁止再次点击。模拟确认仅返回页面，不派发任何动作。','ack');
  else if(action==='waiting')state.notice='短评阶段等待电影详情输出；队列为空不能先报告成功，需等待上游输入关闭及outbox耗尽。';
  else if(action==='capacity')state.notice='容量暂停：待分发上限已到，停止上游推进；已提交结果保留，腾出容量后显式恢复。';
  else if(action==='filter')state.notice='模拟 comments_url 为空：连接过滤，不产生短评输入；上游电影数据保留，过滤不等于下游失败。';
  else if(action==='conflict')requestConfirm('保存配置冲突','阶段 '+state.stage+' 绑定 Schema 1，但模拟目标表已升级不兼容。请重新预演绑定；不能按最新Schema暗中转换。','ack');
  else if(action==='select-record'){state.selectedRecord=true;state.notice='已选择 m001，可预览输入并创建评论单阶段任务。';}
  else if(action==='lineage')requestConfirm('结果来源','c001 ← comment工作项 ← movie本次输出m001 ← ranking输出m001 ← 冻结任务入口；不是读取电影表最新值。','ack');
  else if(action==='dialog-cancel'){closeDialog();state.notice='已取消，未执行后续操作。';}
  else if(action==='dialog-confirm'){const next=state.dialog?.action;closeDialog();if(next){command(next);return;}}
  render();
 }
 document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(b&&!b.disabled){event.preventDefault();command(b.dataset.action);}});
 document.getElementById('confirmation').addEventListener('cancel',()=>{state.dialog=null;});
 window.O0App={state,command,inputForStage,mappingError,render};render();
})();
