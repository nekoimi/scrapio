services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scrapio}
      POSTGRES_USER: ${POSTGRES_USER:-scrapio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  scrapio-browser:
    image: ${SCRAPIO_BROWSER_IMAGE:-ghcr.io/nekoimi/scrapio-browser:test}
    restart: unless-stopped
    environment:
      GRPC_PORT: 8191
      CLOAK_MANAGER_URL: ${CLOAK_MANAGER_URL:?CLOAK_MANAGER_URL is required}
      CLOAK_PROFILE_ID: ${CLOAK_PROFILE_ID:?CLOAK_PROFILE_ID is required}
      CLOAK_AUTH_TOKEN: ${CLOAK_AUTH_TOKEN:-}
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:8191"]
      interval: 10s
      timeout: 5s
      retries: 5

  scrapio:
    image: ghcr.io/nekoimi/scrapio:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      scrapio-browser:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8093}:8093"
    environment:
      TZ: Asia/Shanghai
      PORT: 8093
      DB_SHOW_SQL: ${DB_SHOW_SQL:-false}
      SCRAPIO_CO_HTTP_SLOTS: ${SCRAPIO_CO_HTTP_SLOTS:-2}
      SCRAPIO_CO_BROWSER_SLOTS: ${SCRAPIO_CO_BROWSER_SLOTS:-1}
      SCRAPIO_CO_SITE_INTERVAL_MS: ${SCRAPIO_CO_SITE_INTERVAL_MS:-500}
      SCRAPIO_CO_ACTIVE_RUNS: ${SCRAPIO_CO_ACTIVE_RUNS:-20}
      SCRAPIO_CO_SOURCE_STORAGE_MIB: ${SCRAPIO_CO_SOURCE_STORAGE_MIB:-64}
      SCRAPIO_CO_OUTPUT_STORAGE_MIB: ${SCRAPIO_CO_OUTPUT_STORAGE_MIB:-256}
      SCRAPIO_CO_SOURCE_RETENTION_DAYS: ${SCRAPIO_CO_SOURCE_RETENTION_DAYS:-30}
      SCRAPIO_CO_CHANGE_STORAGE_MIB: ${SCRAPIO_CO_CHANGE_STORAGE_MIB:-128}
      SCRAPIO_CO_CHANGE_RETENTION_DAYS: ${SCRAPIO_CO_CHANGE_RETENTION_DAYS:-30}
      LOG_ROTATION_MAX_SIZE_MB: ${LOG_ROTATION_MAX_SIZE_MB:-20}
      LOG_ROTATION_MAX_BACKUPS: ${LOG_ROTATION_MAX_BACKUPS:-7}
      LOG_ROTATION_MAX_AGE_DAYS: ${LOG_ROTATION_MAX_AGE_DAYS:-7}
      LOG_ROTATION_COMPRESS: ${LOG_ROTATION_COMPRESS:-true}
      DB_DSN: postgres://${POSTGRES_USER:-scrapio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scrapio}?sslmode=disable
      CRAWLER_DRISSION_ROD_GRPC_IP: scrapio-browser
      CRAWLER_DRISSION_ROD_GRPC_PORT: 8191
      SCRAPIO_CREDENTIAL_KEY: ${SCRAPIO_CREDENTIAL_KEY:-}
      # Deployment references must be explicitly passed as SCRAPIO_SECRET_<NAME>.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_EXTERNAL_BASE_URL: ${APP_EXTERNAL_BASE_URL:-}
      QUICK_API_TOKEN: ${QUICK_API_TOKEN:-}
      AI_ASSIST_ENABLED: ${AI_ASSIST_ENABLED:-false}
      AI_ASSIST_BASE_URL: ${AI_ASSIST_BASE_URL:-}
      AI_ASSIST_API_KEY: ${AI_ASSIST_API_KEY:-}
      AI_ASSIST_MODEL: ${AI_ASSIST_MODEL:-}
      AI_ASSIST_MAX_REQUESTS_PER_DAY: ${AI_ASSIST_MAX_REQUESTS_PER_DAY:-10}
    volumes:
      - app-logs:/workspace/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8093/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  postgres-data:
  app-logs:
